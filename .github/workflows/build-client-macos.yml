name: Build Client (macOS)

# There is no Mac in the development loop, so this workflow IS the Mac. It is
# the only place the macOS client gets compiled, conformance-tested, and
# bundled — treat a red run here exactly as you would a local build failure.
#
# It does not deploy anything. The .app and .dmg land as run artifacts, to be
# downloaded and opened on a real Mac when one is available.

on:
  workflow_dispatch:
    inputs:
      universal:
        description: 'Build a universal binary (Intel + Apple silicon) instead of arm64 only'
        type: boolean
        default: false
  push:
    branches: [development, main]
    paths:
      - 'src/hypercomb-client/**'
      # The client BAKES this shell's frontend, and the bake is gitignored —
      # so a web change is a client change that no client path can see.
      - 'src/hypercomb-web/**'
      - '.github/workflows/build-client-macos.yml'

concurrency:
  group: client-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 runner. An Intel-only slice would still need the arm64 target for
    # the universal build, so the Apple-silicon host is the cheaper default.
    runs-on: macos-latest
    name: Build and test the macOS client

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Use Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The universal bundle links both slices, so both targets must be
          # present regardless of which one the runner natively hosts.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/hypercomb-client/target
          key: hc-client-macos-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            hc-client-macos-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-
            hc-client-macos-

      # ── The native side, first ────────────────────────────────────────────
      #
      # Deliberately ahead of the ~10 minutes of Angular below: if the store
      # or the protocol behaves differently on macOS, that is the finding, and
      # waiting on a frontend build to hear about it wastes the run. The
      # conformance vectors are the contract — they are generated by executing
      # the TypeScript, so agreement here is agreement WITH THE WEB SHELL.

      # The LIBRARY crates only — deliberately excluding the app.
      #
      # `tauri::generate_context!()` is a proc macro that reads frontendDist AT
      # COMPILE TIME, so the app crate cannot even build until the frontend has
      # been baked. The three library crates have no such dependency, and they
      # are where the conformance vectors live — which is the whole reason for
      # running early. So the split is not a workaround for the build order; it
      # is the honest boundary. Portable logic here, window down there.
      - name: Conformance and unit tests
        working-directory: src/hypercomb-client
        run: cargo test --release -p hypercomb-protocol -p hypercomb-store -p hypercomb-host -p hypercomb-serve

      - name: Lint the library crates
        working-directory: src/hypercomb-client
        run: |
          cargo clippy --release --all-targets \
            -p hypercomb-protocol -p hypercomb-store -p hypercomb-host -p hypercomb-serve -- -D warnings

      # ── The frontend the window actually shows ────────────────────────────

      - name: Install workspace dependencies
        working-directory: src
        run: npm install

      - name: Build hypercomb-core
        working-directory: src
        run: npm run build:core

      # Also copies the signed modules into hypercomb-web/public/content and
      # stages the core runtime the baked import map points at.
      - name: Build essentials modules
        working-directory: src
        run: npm run build:essentials

      # The shell a VISITOR boots when this machine serves its hive — a
      # different artifact from the app's own frontend, for a different reader.
      # See scripts/stage-host-shell.mjs. Without it the shipped app's
      # Hive > Serve This Hive has nothing to serve.
      - name: Build the shim
        working-directory: src
        run: npm run build:shim

      - name: Stage the host shell into the client
        working-directory: src
        run: node hypercomb-client/scripts/stage-host-shell.mjs

      # The host contract, mechanically, against the real binary: eleven rules
      # that each fail silently and expensively in production. A HARD GATE — a
      # host that fails the contract is not a host.
      - name: Host conformance — check-host.mjs against the real binary
        working-directory: src
        run: |
          set -euo pipefail
          cargo build --release -p hypercomb-serve --bin hypercomb-serve --manifest-path hypercomb-client/Cargo.toml
          HIVE="$(mktemp -d)"
          HOST=hypercomb-client/target/release/hypercomb-serve
          "$HOST" --hive "$HIVE" --shell hypercomb-client/app/host-shell --port 4271 --local &
          HOST_PID=$!
          trap 'kill $HOST_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4271/pin >/dev/null 2>&1 && break
            sleep 1
          done
          node hypercomb-shim/host/check-host.mjs http://localhost:4271

      # The baked import map resolves 'pixi.js' to /vendor/pixi.runtime.js, so
      # the vendor bundle has to exist before the web build copies public/.
      - name: Build the vendored runtimes
        working-directory: src/hypercomb-web
        run: npm run runtime

      - name: Build hypercomb-web
        working-directory: src
        run: npm run build:web

      - name: Bake the client frontend
        working-directory: src
        run: node hypercomb-client/scripts/bake-frontend.mjs

      - name: Verify the baked frontend
        working-directory: src/hypercomb-client/app/frontend
        run: |
          set -euo pipefail
          test -f index.html || { echo "MISSING index.html"; exit 1; }
          grep -q '"importmap"' index.html || { echo "import map was not baked in"; exit 1; }
          test -f content/manifest.json || { echo "MISSING content/manifest.json"; exit 1; }
          SIGS=$(find content -maxdepth 1 -type f -name '????????????????????????????????????????????????????????????????' | wc -l)
          echo "OK: import map baked; $SIGS flat content files."
          test "$SIGS" -gt 0 || { echo "no content shipped"; exit 1; }

      # The app crate's turn — it could not be compiled before this point, for
      # the reason given at the library-test step above. Runs ahead of the
      # bundle so a lint failure costs seconds rather than a full bundling
      # pass, and covers the macOS menu branch that only exists here.
      - name: Lint the app crate
        working-directory: src/hypercomb-client
        run: cargo clippy --release --all-targets -p hypercomb-client -- -D warnings

      # ── Bundle ────────────────────────────────────────────────────────────
      #
      # Signs and notarizes IF the credentials are present, and builds
      # unsigned if they are not. One path, not two workflows: an unsigned
      # build is still a completely valid test build (it runs fine on your own
      # Mac after one `xattr -dr com.apple.quarantine`), so the absence of
      # secrets must never fail the run — it only changes who can open the
      # result without friction.
      #
      # Tauri picks all of this up from the environment. Given APPLE_CERTIFICATE
      # it imports the .p12 into a temporary keychain itself, and given the
      # notarization credentials it submits the bundle to Apple and staples the
      # ticket. Nothing here shells out to codesign or notarytool directly.
      #
      # Secrets are unavailable to PRs from forks, so those simply produce
      # unsigned builds — correct, not a misconfiguration.

      # Run from `app/`, the directory holding BOTH tauri.conf.json and the
      # crate's Cargo.toml. The CLI resolves the project from its working
      # directory, and that is also where it looks for the platform overlay
      # (tauri.macos.conf.json) to merge. Invoking from the workspace root with
      # a --config path is the arrangement that misresolves.
      - name: Build the app bundle
        id: bundle
        working-directory: src/hypercomb-client/app
        env:
          # Signing. Absent => unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. Absent => signed but not notarized, which still warns
          # on other people's machines. Both halves are needed to ship.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # A missing secret arrives as an EMPTY STRING, not as an absent
          # variable — so every credential below is DEFINED even when unset in
          # the repo. Tauri tests for presence, not for emptiness: it saw
          # APPLE_CERTIFICATE="" , concluded it should sign, and failed trying
          # to import an empty certificate into the keychain. The unsigned path
          # was unreachable. Clearing the empties restores it.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "signing as: $APPLE_SIGNING_IDENTITY"
            if [ -n "${APPLE_ID:-}" ]; then
              echo "notarization: enabled (this adds several minutes — Apple's queue)"
            else
              echo "notarization: SKIPPED (no APPLE_ID) — signed, but other Macs will still warn"
            fi
          else
            echo "signing: SKIPPED (no APPLE_SIGNING_IDENTITY) — test build, unsigned"
          fi

          if [ "${{ inputs.universal }}" = "true" ]; then
            npx --yes @tauri-apps/cli@^2 build --target universal-apple-darwin
          else
            npx --yes @tauri-apps/cli@^2 build
          fi

      # Verify against the SYSTEM's own opinion, not our intent. `spctl` is the
      # component Gatekeeper actually consults, so its verdict is the honest
      # answer to "will this open on someone else's Mac" — a bundle can be
      # correctly signed and still be refused because the notarization ticket
      # never got stapled.
      - name: Inspect the signature
        if: always()
        working-directory: src/hypercomb-client
        run: |
          set -uo pipefail
          APP=$(find target -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app to inspect"; exit 0; }

          echo "───────── codesign ─────────"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          echo "───────── deep verify ─────────"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true
          echo "───────── Gatekeeper ─────────"
          if spctl -a -vvv -t exec "$APP" 2>&1; then
            echo "VERDICT: Gatekeeper accepts this bundle — it opens on any Mac."
          else
            echo "VERDICT: Gatekeeper rejects this bundle."
            echo "Fine for your own testing (right-click > Open, or xattr -dr com.apple.quarantine)."
            echo "To hand it to someone else, it needs BOTH a Developer ID signature and notarization."
          fi

      - name: Report what was produced
        if: always()
        working-directory: src/hypercomb-client
        run: |
          find target -type d -name '*.app' -o -type f -name '*.dmg' | sed 's/^/  /' || true

      # ── Does it actually BOOT? ────────────────────────────────────────────
      #
      # "It compiled" is a weak claim for this port. The open question is not
      # Rust — the crates are shared and their tests already ran above — it is
      # whether WKWebView boots the frontend at all. The import map baked by
      # bake-frontend.mjs exists because a SCRIPT-INJECTED map is inert in
      # WebView2; that was measured on Windows, and WKWebView is a different
      # engine. If it disagrees, the window comes up blank and every other
      # check in this workflow still passes.
      #
      # So: launch the bundle, let it boot, and read the milestone trace the
      # client already writes (RENDERER_DIAGNOSTICS in main.rs). Reaching
      # Angular's first paint means the map resolved, the dependencies loaded,
      # and the shell rendered — the whole chain, asserted from outside the
      # window, which is the only place a runner can look.
      #
      # A HARD GATE, as of runs 33456727903 and 33458029136 — both reached
      # boot milestone #13, "bootstrapApplication done (Angular first paint)",
      # which settles the question that kept it non-blocking: whether a runner
      # with no window server could boot the bundle at all. It can.
      #
      # Windows already paid for leaving one of these unblocking: a run went
      # green while its own log read `no Hypercomb.exe was built`, because
      # continue-on-error swallowed it. A smoke test nobody is forced to read
      # is a smoke test that reports nothing.
      - name: Smoke test — launch and confirm first paint
        id: smoke
        working-directory: src/hypercomb-client
        run: |
          set -uo pipefail
          APP=$(find target -type d -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app was built"; exit 1; }
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)
          echo "launching $BIN"

          LOG="$HOME/Library/Application Support/io.hypercomb.client/hive/renderer.log"
          rm -f "$LOG"

          "$BIN" > launch-stdout.txt 2>&1 &
          PID=$!

          # Boot does real work on a cold hive — it installs the bundled
          # package into the store before it can paint. Poll rather than
          # guess a sleep, so a fast boot does not pay for a slow one.
          PAINTED=""
          for i in $(seq 1 60); do
            if [ -f "$LOG" ] && grep -q "Angular first paint" "$LOG"; then PAINTED=yes; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "process exited early"; break; fi
            sleep 5
          done

          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

          echo "───────── renderer.log ─────────"
          cat "$LOG" 2>/dev/null || echo "(no renderer log was written)"
          echo "───────── stdout ─────────"
          cat launch-stdout.txt || true
          echo "──────────────────────────"

          if [ -z "$PAINTED" ]; then
            echo "DID NOT REACH FIRST PAINT — the milestone trace above shows how far it got."
            exit 1
          fi

          # Reaching paint is the bar; CSP refusals are still worth surfacing
          # loudly, since they degrade features rather than stop the boot.
          if grep -q "\[renderer:csp\]" "$LOG"; then
            echo "NOTE: CSP violations were reported — see the csp lines above."
          fi
          echo "PASS: the macOS client booted to Angular first paint."

      # Only when there was actually something to bundle. `if: always()` alone
      # made an early failure raise a SECOND red X for missing artifacts,
      # which competes with the real error for attention.
      - name: Upload the client
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hypercomb-client-macos${{ inputs.universal == true && '-universal' || '-arm64' }}
          path: |
            src/hypercomb-client/target/**/release/bundle/macos/*.app
            src/hypercomb-client/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # A blank window with a working process is the failure mode this client
      # is built to make visible (see RENDERER_DIAGNOSTICS in main.rs). On a
      # runner there is nobody to look at the window, so the log is the only
      # witness — keep it whenever the run got far enough to produce one.
      - name: Upload renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-log-macos
          # Literal, not `~` — upload-artifact does not expand a tilde.
          path: /Users/runner/Library/Application Support/io.hypercomb.client/**/renderer.log
          if-no-files-found: ignore

      # The smoke test fails the run now, but a red X names the step, not what
      # the step proves. Say it in words too — and `if: always()` is what keeps
      # this running once the gate can trip.
      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "### macOS client: booted to first paint" >> $GITHUB_STEP_SUMMARY
          else
            echo "### macOS client: BUILT, but did not confirm first paint" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The bundle is attached as an artifact. Check the smoke-test step's" >> $GITHUB_STEP_SUMMARY
            echo "milestone trace to see how far boot got before it stalled." >> $GITHUB_STEP_SUMMARY
          fi
