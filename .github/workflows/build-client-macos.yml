name: Build Client (macOS)

# There is no Mac in the development loop, so this workflow IS the Mac. It is
# the only place the macOS client gets compiled, conformance-tested, and
# bundled — treat a red run here exactly as you would a local build failure.
#
# It does not deploy anything. The .app and .dmg land as run artifacts, to be
# downloaded and opened on a real Mac when one is available.

on:
  workflow_dispatch:
    inputs:
      universal:
        description: 'Build a universal binary (Intel + Apple silicon) instead of arm64 only'
        type: boolean
        default: false
  push:
    branches: [development, main]
    paths:
      - 'src/hypercomb-client/**'
      - '.github/workflows/build-client-macos.yml'

concurrency:
  group: client-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 runner. An Intel-only slice would still need the arm64 target for
    # the universal build, so the Apple-silicon host is the cheaper default.
    runs-on: macos-latest
    name: Build and test the macOS client

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Use Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The universal bundle links both slices, so both targets must be
          # present regardless of which one the runner natively hosts.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/hypercomb-client/target
          key: hc-client-macos-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            hc-client-macos-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-
            hc-client-macos-

      # ── The native side, first ────────────────────────────────────────────
      #
      # Deliberately ahead of the ~10 minutes of Angular below: if the store
      # or the protocol behaves differently on macOS, that is the finding, and
      # waiting on a frontend build to hear about it wastes the run. The
      # conformance vectors are the contract — they are generated by executing
      # the TypeScript, so agreement here is agreement WITH THE WEB SHELL.

      - name: Conformance and unit tests
        working-directory: src/hypercomb-client
        run: cargo test --workspace --release

      - name: Lint (warnings are failures)
        working-directory: src/hypercomb-client
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ── The frontend the window actually shows ────────────────────────────

      - name: Install workspace dependencies
        working-directory: src
        run: npm install

      - name: Build hypercomb-core
        working-directory: src
        run: npm run build:core

      # Also copies the signed modules into hypercomb-web/public/content and
      # stages the core runtime the baked import map points at.
      - name: Build essentials modules
        working-directory: src
        run: npm run build:essentials

      # The baked import map resolves 'pixi.js' to /vendor/pixi.runtime.js, so
      # the vendor bundle has to exist before the web build copies public/.
      - name: Build the vendored runtimes
        working-directory: src/hypercomb-web
        run: npm run runtime

      - name: Build hypercomb-web
        working-directory: src
        run: npm run build:web

      - name: Bake the client frontend
        working-directory: src
        run: node hypercomb-client/scripts/bake-frontend.mjs

      - name: Verify the baked frontend
        working-directory: src/hypercomb-client/app/frontend
        run: |
          set -euo pipefail
          test -f index.html || { echo "MISSING index.html"; exit 1; }
          grep -q '"importmap"' index.html || { echo "import map was not baked in"; exit 1; }
          test -f content/manifest.json || { echo "MISSING content/manifest.json"; exit 1; }
          SIGS=$(find content -maxdepth 1 -type f -name '????????????????????????????????????????????????????????????????' | wc -l)
          echo "OK: import map baked; $SIGS flat content files."
          test "$SIGS" -gt 0 || { echo "no content shipped"; exit 1; }

      # ── Bundle ────────────────────────────────────────────────────────────
      #
      # Unsigned and un-notarized on purpose: no Apple Developer credentials
      # live in this repo. Gatekeeper will refuse the result on first open —
      # right-click > Open, or `xattr -dr com.apple.quarantine`, gets past it
      # for testing. Shipping to anyone else needs a Developer ID and a
      # notarization pass; that is a separate piece of work, not a flag here.

      - name: Build the app bundle
        working-directory: src/hypercomb-client
        run: |
          set -euo pipefail
          if [ "${{ inputs.universal }}" = "true" ]; then
            npx --yes @tauri-apps/cli@^2 build --config app/tauri.conf.json --target universal-apple-darwin
          else
            npx --yes @tauri-apps/cli@^2 build --config app/tauri.conf.json
          fi

      - name: Report what was produced
        if: always()
        working-directory: src/hypercomb-client
        run: |
          find target -type d -name '*.app' -o -type f -name '*.dmg' | sed 's/^/  /' || true

      # ── Does it actually BOOT? ────────────────────────────────────────────
      #
      # "It compiled" is a weak claim for this port. The open question is not
      # Rust — the crates are shared and their tests already ran above — it is
      # whether WKWebView boots the frontend at all. The import map baked by
      # bake-frontend.mjs exists because a SCRIPT-INJECTED map is inert in
      # WebView2; that was measured on Windows, and WKWebView is a different
      # engine. If it disagrees, the window comes up blank and every other
      # check in this workflow still passes.
      #
      # So: launch the bundle, let it boot, and read the milestone trace the
      # client already writes (RENDERER_DIAGNOSTICS in main.rs). Reaching
      # Angular's first paint means the map resolved, the dependencies loaded,
      # and the shell rendered — the whole chain, asserted from outside the
      # window, which is the only place a runner can look.
      #
      # Non-blocking for now: this is the first time it runs on macOS and a
      # runner-environment quirk (no window server for a background process)
      # would otherwise mask the build artifacts. Flip to a hard gate once a
      # green run confirms the step itself is sound.
      - name: Smoke test — launch and confirm first paint
        id: smoke
        continue-on-error: true
        working-directory: src/hypercomb-client
        run: |
          set -uo pipefail
          APP=$(find target -type d -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app was built"; exit 1; }
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)
          echo "launching $BIN"

          LOG="$HOME/Library/Application Support/io.hypercomb.client/hive/renderer.log"
          rm -f "$LOG"

          "$BIN" > launch-stdout.txt 2>&1 &
          PID=$!

          # Boot does real work on a cold hive — it installs the bundled
          # package into the store before it can paint. Poll rather than
          # guess a sleep, so a fast boot does not pay for a slow one.
          PAINTED=""
          for i in $(seq 1 60); do
            if [ -f "$LOG" ] && grep -q "Angular first paint" "$LOG"; then PAINTED=yes; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "process exited early"; break; fi
            sleep 5
          done

          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

          echo "───────── renderer.log ─────────"
          cat "$LOG" 2>/dev/null || echo "(no renderer log was written)"
          echo "───────── stdout ─────────"
          cat launch-stdout.txt || true
          echo "──────────────────────────"

          if [ -z "$PAINTED" ]; then
            echo "DID NOT REACH FIRST PAINT — the milestone trace above shows how far it got."
            exit 1
          fi

          # Reaching paint is the bar; CSP refusals are still worth surfacing
          # loudly, since they degrade features rather than stop the boot.
          if grep -q "\[renderer:csp\]" "$LOG"; then
            echo "NOTE: CSP violations were reported — see the csp lines above."
          fi
          echo "PASS: the macOS client booted to Angular first paint."

      - name: Upload the client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypercomb-client-macos${{ inputs.universal == true && '-universal' || '-arm64' }}
          path: |
            src/hypercomb-client/target/**/release/bundle/macos/*.app
            src/hypercomb-client/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # A blank window with a working process is the failure mode this client
      # is built to make visible (see RENDERER_DIAGNOSTICS in main.rs). On a
      # runner there is nobody to look at the window, so the log is the only
      # witness — keep it whenever the run got far enough to produce one.
      - name: Upload renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-log-macos
          # Literal, not `~` — upload-artifact does not expand a tilde.
          path: /Users/runner/Library/Application Support/io.hypercomb.client/**/renderer.log
          if-no-files-found: ignore

      # The smoke test is deliberately non-blocking (see its comment), which
      # means a failure there would otherwise leave the run green and the
      # finding buried in the log. Say it plainly in the summary instead.
      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "### macOS client: booted to first paint" >> $GITHUB_STEP_SUMMARY
          else
            echo "### macOS client: BUILT, but did not confirm first paint" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The bundle is attached as an artifact. Check the smoke-test step's" >> $GITHUB_STEP_SUMMARY
            echo "milestone trace to see how far boot got before it stalled." >> $GITHUB_STEP_SUMMARY
          fi
