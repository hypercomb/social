name: Build Client (Windows)

# The Windows twin of build-client-macos.yml, and for a while the only place
# the Windows client can be built at all: a machine with Smart App Control
# enforced refuses to EXECUTE freshly compiled, unsigned binaries — which is
# what every cargo build script is — so `cargo build -p hypercomb-client` dies
# there with `os error 4551` before it ever reaches the bundler. A runner has
# no such policy.
#
# It does not deploy anything. The .msi and the NSIS .exe land as run
# artifacts, to be downloaded and installed.

on:
  workflow_dispatch:
  push:
    branches: [development, main]
    # The frontend is baked into the binary at compile time, so frontend
    # source IS client source — a shell/module change with no rebuild leaves
    # the shipped exe silently stale (248 commits deep, once).
    paths:
      - 'src/hypercomb-client/**'
      - 'src/hypercomb-core/**'
      - 'src/hypercomb-essentials/**'
      - 'src/hypercomb-shared/**'
      - 'src/hypercomb-web/**'
      - '.github/workflows/build-client-windows.yml'

concurrency:
  group: client-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash, so the steps below read the same as their macOS twins and the
    # two workflows can be diffed against each other. Steps that genuinely
    # want Windows — the certificate store, launching a GUI process — ask for
    # pwsh explicitly.
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    name: Build and test the Windows client

    # Hoisted to the job because the `secrets` context is NOT available in a
    # step-level `if` — `env` is. Testing `secrets.X != ''` there silently
    # evaluates to nothing and the guarded step never runs.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Use Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # WebView2 is the engine, not a detail: without the runtime the window
      # comes up blank and every other check still passes. It ships with the
      # runner image today — assert it rather than assume it, so the day that
      # changes reads as "no WebView2" instead of "the shell is broken".
      - name: Confirm the WebView2 runtime is present
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $found = $keys | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if ($found) { "WebView2 runtime $($found.pv)" }
          else { "::warning::No WebView2 runtime found — the smoke test will show a blank window." }

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/hypercomb-client/target
          key: hc-client-windows-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            hc-client-windows-${{ hashFiles('src/hypercomb-client/Cargo.lock') }}-
            hc-client-windows-

      # ── The native side, first ────────────────────────────────────────────
      #
      # Deliberately ahead of the ~10 minutes of Angular below: if the store or
      # the protocol behaves differently on Windows, that is the finding, and
      # waiting on a frontend build to hear about it wastes the run. The
      # conformance vectors are the contract — they are generated by executing
      # the TypeScript, so agreement here is agreement WITH THE WEB SHELL.
      #
      # The LIBRARY crates only — deliberately excluding the app.
      # `tauri::generate_context!()` is a proc macro that reads frontendDist AT
      # COMPILE TIME, so the app crate cannot even build until the frontend has
      # been baked. The three library crates have no such dependency.
      #
      # This is also the step that exercises `a_commit_survives_process_abort`,
      # which spawns a freshly built helper binary — the exact thing Smart App
      # Control refuses on a locked-down developer machine. Here it runs, so
      # durability is actually covered somewhere.
      - name: Conformance and unit tests
        working-directory: src/hypercomb-client
        run: cargo test --release -p hypercomb-protocol -p hypercomb-store -p hypercomb-host

      - name: Lint the library crates
        working-directory: src/hypercomb-client
        run: |
          cargo clippy --release --all-targets \
            -p hypercomb-protocol -p hypercomb-store -p hypercomb-host -- -D warnings

      # ── The frontend the window actually shows ────────────────────────────

      - name: Install workspace dependencies
        working-directory: src
        run: npm install

      - name: Build hypercomb-core
        working-directory: src
        run: npm run build:core

      # Also copies the signed modules into hypercomb-web/public/content and
      # stages the core runtime the baked import map points at.
      - name: Build essentials modules
        working-directory: src
        run: npm run build:essentials

      # The baked import map resolves 'pixi.js' to /vendor/pixi.runtime.js, so
      # the vendor bundle has to exist before the web build copies public/.
      - name: Build the vendored runtimes
        working-directory: src/hypercomb-web
        run: npm run runtime

      - name: Build hypercomb-web
        working-directory: src
        run: npm run build:web

      # bake-frontend.mjs exists BECAUSE of this platform: a script-injected
      # import map is inert in WebView2. Run it by hand (no --if-available) so
      # a contentless dist fails here rather than shipping a blank window.
      - name: Bake the client frontend
        working-directory: src
        run: node hypercomb-client/scripts/bake-frontend.mjs

      - name: Verify the baked frontend
        working-directory: src/hypercomb-client/app/frontend
        run: |
          set -euo pipefail
          test -f index.html || { echo "MISSING index.html"; exit 1; }
          grep -q '"importmap"' index.html || { echo "import map was not baked in"; exit 1; }
          test -f content/manifest.json || { echo "MISSING content/manifest.json"; exit 1; }
          SIGS=$(find content -maxdepth 1 -type f -name '????????????????????????????????????????????????????????????????' | wc -l)
          echo "OK: import map baked; $SIGS flat content files."
          test "$SIGS" -gt 0 || { echo "no content shipped"; exit 1; }

      # The app crate's turn — it could not be compiled before this point, for
      # the reason given at the library-test step above. Runs ahead of the
      # bundle so a lint failure costs seconds rather than a full bundling
      # pass, and covers the Windows arm of the menu branch in main.rs.
      - name: Lint the app crate
        working-directory: src/hypercomb-client
        run: cargo clippy --release --all-targets -p hypercomb-client -- -D warnings

      # ── Signing ───────────────────────────────────────────────────────────
      #
      # Optional, and absent by default. Unlike Apple's, Tauri's Windows
      # signing is driven by a certificate THUMBPRINT resolved against the
      # machine's own certificate store, so a CI signature needs the .pfx
      # imported first — which is all this step does. It emits the thumbprint
      # for the bundle step to pass through `--config`.
      #
      # A missing secret arrives as an EMPTY STRING, not as an absent variable
      # (the lesson the macOS workflow paid for), so the guard tests for
      # emptiness and the unsigned path stays reachable.
      #
      # UNEXERCISED: no certificate has ever been configured for this repo, so
      # this branch has never run. Treat its first green run as the test.
      - name: Import the signing certificate
        id: cert
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          # A .pfx may carry a chain; the leaf is the one that signs.
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Select-Object -First 1
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "imported certificate $($cert.Subject)"

      # ── Bundle ────────────────────────────────────────────────────────────
      #
      # Signs IF a certificate was imported, and builds unsigned if it was not.
      # One path, not two workflows: an unsigned build is a completely valid
      # test build, so the absence of secrets must never fail the run — it only
      # changes who can install the result without fighting SmartScreen.
      #
      # Run from `app/`, the directory holding BOTH tauri.conf.json and the
      # crate's Cargo.toml. The CLI resolves the project from its working
      # directory, and that is also where it looks for the platform overlay
      # (tauri.windows.conf.json, which is what selects msi + nsis) to merge.
      # Invoking from the workspace root with a --config path is the
      # arrangement that misresolves.
      - name: Build the app bundle
        id: bundle
        working-directory: src/hypercomb-client/app
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          set -euo pipefail
          if [ -n "${THUMBPRINT:-}" ]; then
            # A FILE, not inline JSON. `--config` takes either, but an inline
            # object has to survive Git Bash -> npx.cmd -> node, and that path
            # eats double quotes on Windows. A file has no quoting at all.
            cat > signing.conf.json <<JSON
          {
            "bundle": {
              "windows": {
                "certificateThumbprint": "$THUMBPRINT",
                "digestAlgorithm": "sha256",
                "timestampUrl": "http://timestamp.digicert.com"
              }
            }
          }
          JSON
            echo "signing with thumbprint $THUMBPRINT (RFC-3161 timestamp, SHA-256)"
            npx --yes @tauri-apps/cli@^2 build --config signing.conf.json
            rm -f signing.conf.json
          else
            echo "signing: SKIPPED (no WINDOWS_CERTIFICATE) — test build, unsigned"
            npx --yes @tauri-apps/cli@^2 build
          fi

      # Verify against the SYSTEM's own opinion, not our intent.
      # Get-AuthenticodeSignature is what Windows itself consults, so its
      # verdict is the honest answer to "will this install on someone else's
      # machine without a fight".
      - name: Inspect the signature
        if: always()
        working-directory: src/hypercomb-client
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path target -Recurse -Include *.msi, *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bundle' }
          if (-not $artifacts) { "no installer to inspect"; exit 0 }
          $signed = $false
          foreach ($a in $artifacts) {
            $sig = Get-AuthenticodeSignature $a.FullName
            "$($a.Name): $($sig.Status)"
            if ($sig.Status -eq 'Valid') { $signed = $true; "  signer: $($sig.SignerCertificate.Subject)" }
          }
          if ($signed) {
            "VERDICT: signed. SmartScreen still gates on REPUTATION, which a new"
            "certificate has to earn through downloads — an OV certificate warns"
            "until it does; an EV one is trusted immediately."
          } else {
            "VERDICT: unsigned."
            "Fine for your own testing (More info > Run anyway on the SmartScreen prompt)."
            "NOT enough for a machine with Smart App Control enforced — that refuses"
            "unsigned binaries outright, with no override short of turning the"
            "feature off permanently. To hand this to anyone, it needs a code"
            "signing certificate configured as WINDOWS_CERTIFICATE."
          }

      - name: Report what was produced
        if: always()
        working-directory: src/hypercomb-client
        run: |
          find target -type f \( -name '*.msi' -o -name '*-setup.exe' \) | sed 's/^/  /' || true

      # ── Does it actually BOOT? ────────────────────────────────────────────
      #
      # "It compiled" is a weak claim: the crates are shared and their tests
      # already ran above. The open question is whether WebView2 boots the
      # baked frontend — and a blank window passes every other check in this
      # workflow. So launch the raw binary (no install needed), let it boot,
      # and read the milestone trace the client already writes
      # (RENDERER_DIAGNOSTICS in main.rs). Reaching Angular's first paint means
      # the import map resolved, the dependencies loaded and the shell
      # rendered — the whole chain, asserted from outside the window, which is
      # the only place a runner can look.
      #
      # A HARD GATE, as of run 32366098422 — which reached boot milestone #14,
      # "bootstrapApplication done (Angular first paint)", proving the step
      # itself is sound on a runner.
      #
      # It was non-blocking for exactly one run, and that run earned the gate:
      # it went GREEN while the log read `no Hypercomb.exe was built`, because
      # continue-on-error swallowed it. A smoke test nobody is forced to read
      # is a smoke test that reports nothing.
      - name: Smoke test — launch and confirm first paint
        id: smoke
        working-directory: src/hypercomb-client
        shell: pwsh
        run: |
          # Cargo names the binary after the CRATE — hypercomb-client.exe.
          # `productName` ("Hypercomb") only takes effect INSIDE the bundle, so
          # searching for Hypercomb.exe outside bundle/ finds nothing: the
          # first run of this workflow reported "no Hypercomb.exe was built"
          # while both installers sat next to it. The macOS twin looks for a
          # .app and never had the problem.
          #
          # The raw release binary is the right target anyway — the frontend is
          # baked into it by generate_context!, so it needs no install.
          $exe = Get-Item 'target/release/hypercomb-client.exe' -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-ChildItem -Path target -Recurse -File -Filter 'hypercomb-client.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -notmatch 'deps|build' } | Select-Object -First 1
          }
          if (-not $exe) { "no client binary was built"; exit 1 }
          "launching $($exe.FullName)"

          $log = Join-Path $env:APPDATA 'io.hypercomb.client\hive\renderer.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          # Absolute: Start-Process resolves a relative redirect path against
          # .NET's current directory, which is not necessarily $PWD.
          $out = Join-Path $PWD 'launch-stdout.txt'
          $err = Join-Path $PWD 'launch-stderr.txt'
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err

          # Boot does real work on a cold hive — it adopts the bundled package
          # into the store before it can paint. Poll rather than guess a sleep,
          # so a fast boot does not pay for a slow one.
          $painted = $false
          foreach ($i in 1..60) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Angular first paint' -Quiet)) {
              $painted = $true; break
            }
            if ($p.HasExited) { "process exited early (code $($p.ExitCode))"; break }
            Start-Sleep -Seconds 5
          }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

          "───────── renderer.log ─────────"
          if (Test-Path $log) { Get-Content $log } else { "(no renderer log was written)" }
          "───────── stdout ─────────"
          Get-Content $out -ErrorAction SilentlyContinue
          "───────── stderr ─────────"
          Get-Content $err -ErrorAction SilentlyContinue
          "──────────────────────────"

          if (-not $painted) {
            "DID NOT REACH FIRST PAINT — the milestone trace above shows how far it got."
            exit 1
          }
          # Reaching paint is the bar; CSP refusals are still worth surfacing
          # loudly, since they degrade features rather than stop the boot.
          if (Select-String -Path $log -Pattern '\[renderer:csp\]' -Quiet) {
            "::warning::CSP violations were reported — see the csp lines above."
          }
          "PASS: the Windows client booted to Angular first paint."

      # Only when there was actually something to bundle. `if: always()` alone
      # made an early failure raise a SECOND red X for missing artifacts, which
      # competes with the real error for attention.
      - name: Upload the client
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hypercomb-client-windows-x64
          path: |
            src/hypercomb-client/target/release/bundle/msi/*.msi
            src/hypercomb-client/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A blank window with a working process is the failure mode this client
      # is built to make visible (see RENDERER_DIAGNOSTICS in main.rs). On a
      # runner there is nobody to look at the window, so the log is the only
      # witness — keep it whenever the run got far enough to produce one.
      - name: Upload renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Literal, not a variable — upload-artifact does not expand one.
          path: C:\Users\runneradmin\AppData\Roaming\io.hypercomb.client\**\renderer.log
          name: renderer-log-windows
          if-no-files-found: ignore

      # The smoke test is deliberately non-blocking (see its comment), which
      # means a failure there would otherwise leave the run green and the
      # finding buried in the log. Say it plainly in the summary instead.
      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "### Windows client: booted to first paint" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Windows client: BUILT, but did not confirm first paint" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The installers are attached as artifacts. Check the smoke-test step's" >> $GITHUB_STEP_SUMMARY
            echo "milestone trace to see how far boot got before it stalled." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -z "${{ steps.cert.outputs.thumbprint }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build is **unsigned** — a machine with Smart App Control enforced will" >> $GITHUB_STEP_SUMMARY
            echo "refuse to run it. Add \`WINDOWS_CERTIFICATE\` (base64 .pfx) and" >> $GITHUB_STEP_SUMMARY
            echo "\`WINDOWS_CERTIFICATE_PASSWORD\` to sign." >> $GITHUB_STEP_SUMMARY
          fi
