<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hypercomb Development</title>
  <base href="/">

  <!-- Theme pre-paint: reflect the stored theme onto <html> before first paint
       so there's no flash. ThemeService (@hypercomb.social/Theme) owns it
       thereafter. Boots dark when no preference is stored; 'system' clears the
       attribute and follows prefers-color-scheme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hc:theme');
        var el = document.documentElement;
        if (t === 'system') el.removeAttribute('data-theme');
        else el.setAttribute('data-theme', t || 'honey');
      } catch (e) {}
    })();
  </script>

  <!-- Keep parity with the production shell: an older cached show-cell bee
       interprets an unset readiness shade as ON and can make every tile look
       absent. Establish the safe default before any module evaluates it. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('hc:tile-shade') === null) {
          localStorage.setItem('hc:tile-shade', '0');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Keep parity with the production shell: an older cached show-cell bee
       interprets an unset readiness shade as ON and can make every tile look
       absent. Establish the safe default before any module evaluates it. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('hc:tile-shade') === null) {
          localStorage.setItem('hc:tile-shade', '0');
        }
      } catch (e) {}
    })();
  </script>

  <!-- interactive-widget=resizes-content: keyboard shrinks the layout viewport
       (Android) so bottom-anchored chrome rides above it. Kept in sync with
       hypercomb-web/src/index.html (shell parity). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Built by `node scripts/build-favicons.cjs` — same mark as the app. -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Inter (UI) + Source Serif 4 (display) + Material Symbols (icons), all
       self-hosted. NOTHING here may point at a third-party origin — an
       off-origin font/script/style hands that host the visitor's IP, UA and
       Referer on every page load. See documentation/no-third-party-requests.md.
       JetBrains Mono is NOT here: hypercomb-shared/fonts/_fonts.scss already
       self-hosts it, so the old Google link for it was a duplicate download.
       Regenerate:
       `node scripts/fetch-fonts.cjs hypercomb-dev/public/fonts inter source-serif material-symbols` -->
  <link rel="stylesheet" href="fonts/fonts.css?v=2a97dfed83">

  <!-- Loading-page (genesis splash) styles — in <head> so they survive the
       re-parent out of <app-root> that keeps the splash up until tiles paint. -->
  <style>
    #hc-splash{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:radial-gradient(120% 90% at 50% 42%,#0c1018 0%,#05060a 60%,#030409 100%)}
    #hc-splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hc-splash .m{position:absolute;left:0;right:0;top:calc(66% + 30px);text-align:center;color:#dfe8f0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:clamp(15px,2.76vw,23px);letter-spacing:.62em;text-indent:.62em;font-weight:600;pointer-events:none;user-select:none}
  </style>
</head>
<body>
  <script src="env.js"></script>
  <app-root>
    <!-- Loading page: genesis animation. Paints instantly; splash.js re-parents
         #hc-splash to <body> so it survives bootstrap, then dismisses when the
         first tiles paint. Styles live in <head> so they persist after the move. -->
    <div id="hc-splash" aria-hidden="true">
      <canvas id="hc-splash-cv"></canvas>
      <div class="m">hypercomb</div>
    </div>
    <script src="splash.js"></script>
  </app-root>
</body>
</html>
