@if (active()) {
  <div class="camera-overlay" role="dialog" [attr.aria-label]="'camera.title' | t">
    <video #video autoplay playsinline muted [class.mirrored]="facing() === 'user'"></video>

    <!-- The hexagon is the frame you are shooting for: what lands inside it is
         what the tile shows. Everything outside is dimmed, not cropped — the
         capture is the centre square, so the corners still carry. -->
    <div class="camera-hex-frame"></div>

    <div class="camera-controls">
      <button type="button" class="camera-control-btn" (click)="close()"
              [attr.aria-label]="'camera.close' | t">
        <span class="mat-sym">close</span>
      </button>

      <button type="button" class="camera-shutter" [class.busy]="busy()"
              (click)="shoot()"
              [attr.aria-label]="'camera.shutter' | t"></button>

      <button type="button" class="camera-control-btn" (click)="flip()"
              [attr.aria-label]="'camera.flip' | t">
        <span class="mat-sym">cameraswitch</span>
      </button>
    </div>

    <div class="camera-hint">{{ 'camera.hint' | t }}</div>
  </div>
}
