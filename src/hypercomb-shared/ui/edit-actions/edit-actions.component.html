<!-- Fixed bottom-right cluster: Undo · Redo, plus the word "save" that
     appears only once you've rewound (the merge — choose what to move
     forward with). While tiles are selected (at head) the cluster also
     grows the selection verbs — visually to shelf · remove, left of
     undo. Container is row-reverse: later DOM children extend LEFT, so
     undo never moves under the cursor. -->
<!-- THE CLUSTER SURVIVES A VIEW; ITS CONTENTS MOSTLY DO NOT. A page — a
     website, a game, a document — takes the screen, and the app's editing
     chrome has no business on it: undo, redo, save and the selection verbs
     all belong to the hive you are standing in, not to the thing you are
     reading. ANNOTATE is the exception, and the reason this is a per-control
     gate instead of the old `display:none` on the whole box: the moment you
     most want to draw on the screen and ask about it is when a page is what
     is on the screen. Over a view it lifts to the view's own stacking band —
     at the cluster's resting z-index it would be painted over. -->
<div class="edit-actions" role="group" [attr.aria-label]="'controls.edit-actions' | t"
  [class.over-view]="viewActive()"
  [style.display]="viewActive() && !canAnnotate() ? 'none' : null">
  @if (!viewActive()) {
    <button
      class="ea-btn"
      type="button"
      (click)="toggleOrientation()"
      [attr.aria-label]="(flatTop() ? 'editor.switch-to-point' : 'editor.switch-to-flat') | t"
      [title]="(flatTop() ? 'editor.switch-to-point' : 'editor.switch-to-flat') | t"
    >
      <span class="mat-sym">crop_rotate</span>
    </button>
  }

  <!-- ANNOTATE — this corner used to open the feedback window, and the swap is
       the point. Filing an issue hands somebody a complaint; drawing on the
       screen and starting a conversation from it hands the assistant the
       thing itself, in the place it happened. Same corner, same reflex,
       different ending. Row-reverse puts it immediately LEFT of the rotate
       icon, where the forum glyph was.
       Hidden where the browser cannot photograph its own screen (every
       phone): a control that can only fail is worse than no control. -->
  @if (canAnnotate()) {
    <button
      class="ea-btn"
      type="button"
      (click)="annotate()"
      [attr.aria-label]="'annotate.open' | t"
      [title]="'annotate.open' | t"
    >
      <span class="mat-sym">draw</span>
    </button>
  }

  @if (!viewActive()) {
  <button
    class="ea-btn"
    type="button"
    (click)="undo()"
    [disabled]="!canUndo()"
    [attr.aria-label]="'controls.undo' | t"
    [title]="'controls.undo' | t"
  >
    <span class="mat-sym">undo</span>
  </button>

  @if (canRedo()) {
    <button
      class="ea-btn"
      type="button"
      (click)="redo()"
      [attr.aria-label]="'controls.redo' | t"
      [title]="'controls.redo' | t"
    >
      <span class="mat-sym">redo</span>
    </button>
  }

  @if (rewound()) {
    <span class="ea-divider" aria-hidden="true"></span>
    <button
      class="ea-save"
      type="button"
      (click)="save()"
      [disabled]="saving()"
      [attr.aria-label]="'controls.save' | t"
      [title]="'controls.save' | t"
    >{{ 'controls.save' | t }}</button>
  }

  <!-- SYNC — beside save, same word-weight: it is the other half of keeping
       work. Save keeps it on this device; sync brings the other paired devices
       level with it (and this one with them). Only a paired device shows it. -->
  @if (syncPaired()) {
    <span class="ea-divider" aria-hidden="true"></span>
    <button
      class="ea-save"
      type="button"
      (click)="sync()"
      [disabled]="syncing()"
      [attr.aria-label]="'controls.sync.title' | t"
      [title]="'controls.sync.title' | t"
    >{{ (syncing() ? 'controls.syncing' : 'controls.sync') | t }}</button>
  }

  @if (!rewound() && selectionCount() > 0) {
    <span class="ea-divider" aria-hidden="true"></span>
    <!-- ADOPT — only while the selection holds tiles that are somebody
         else's. One press takes them all; the batch is owed in the adopt
         queue, so a reload finishes it. -->
    @if (adoptableCount() > 0) {
      <button
        class="ea-btn"
        type="button"
        (click)="adopt()"
        [attr.aria-label]="'selection.adopt' | t: { count: adoptableCount() }"
        [title]="'selection.adopt' | t: { count: adoptableCount() }"
      >
        <span class="mat-sym">cloud_download</span>
      </button>
    }
    <button
      class="ea-btn"
      type="button"
      (click)="remove()"
      [attr.aria-label]="'selection.remove' | t"
      [title]="'selection.remove' | t"
    >
      <span class="mat-sym">delete</span>
    </button>
    <!-- The tray-with-an-arrow glyph is drawn inline — the same path as the
         tile's shelf icon, so the two read as one gesture, and no icon-font
         subset has to carry it. -->
    <button
      class="ea-btn ea-shelf"
      type="button"
      (click)="toShelf()"
      [attr.aria-label]="'selection.to-shelf' | t: { count: selectionCount() }"
      [title]="'selection.to-shelf' | t: { count: selectionCount() }"
    >
      <svg class="ea-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3H4.99c-1.11 0-1.98.9-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10zm-3-5h-2V7h-4v3H8l4 4 4-4z"/></svg>
    </button>
  }
  }
</div>
