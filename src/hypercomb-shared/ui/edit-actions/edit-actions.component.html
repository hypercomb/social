<!-- Fixed bottom-right cluster: Undo · Redo, plus the word "save" that
     appears only once you've rewound (the merge — choose what to move
     forward with). While tiles are selected (at head) the cluster also
     grows the selection verbs — visually cut · copy · remove, left of
     undo. Container is row-reverse: later DOM children extend LEFT, so
     undo never moves under the cursor. -->
<div class="edit-actions" role="group" [attr.aria-label]="'controls.edit-actions' | t">
  <button
    class="ea-btn"
    type="button"
    (click)="toggleOrientation()"
    [attr.aria-label]="(flatTop() ? 'editor.switch-to-point' : 'editor.switch-to-flat') | t"
    [title]="(flatTop() ? 'editor.switch-to-point' : 'editor.switch-to-flat') | t"
  >
    <span class="mat-sym">crop_rotate</span>
  </button>

  <button
    class="ea-btn"
    type="button"
    (click)="undo()"
    [disabled]="!canUndo()"
    [attr.aria-label]="'controls.undo' | t"
    [title]="'controls.undo' | t"
  >
    <span class="mat-sym">undo</span>
  </button>

  @if (canRedo()) {
    <button
      class="ea-btn"
      type="button"
      (click)="redo()"
      [attr.aria-label]="'controls.redo' | t"
      [title]="'controls.redo' | t"
    >
      <span class="mat-sym">redo</span>
    </button>
  }

  @if (rewound()) {
    <span class="ea-divider" aria-hidden="true"></span>
    <button
      class="ea-save"
      type="button"
      (click)="save()"
      [disabled]="saving()"
      [attr.aria-label]="'controls.save' | t"
      [title]="'controls.save' | t"
    >{{ 'controls.save' | t }}</button>
  }

  @if (!rewound() && selectionCount() > 0) {
    <span class="ea-divider" aria-hidden="true"></span>
    <button
      class="ea-btn"
      type="button"
      (click)="remove()"
      [attr.aria-label]="'selection.remove' | t"
      [title]="'selection.remove' | t"
    >
      <span class="mat-sym">delete</span>
    </button>
    <button
      class="ea-btn"
      type="button"
      (click)="copy()"
      [attr.aria-label]="'selection.copy' | t"
      [title]="'selection.copy' | t"
    >
      <span class="mat-sym">content_copy</span>
    </button>
    <button
      class="ea-btn"
      type="button"
      (click)="cut()"
      [attr.aria-label]="'selection.cut' | t"
      [title]="'selection.cut' | t"
    >
      <span class="mat-sym">content_cut</span>
    </button>
  }
</div>
