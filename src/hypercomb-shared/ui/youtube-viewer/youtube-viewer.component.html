@if (embedUrl(); as url) {
  <div class="viewer-backdrop" [class.chrome-hidden]="!chromeVisible()"
       (click)="onBackdropClick()" (pointermove)="onPointerMove()">
    <div class="video-container" (click)="$event.stopPropagation()">
      <!-- `referrerpolicy` is LOAD-BEARING, not hygiene. The player validates
           the embedding page from the HTTP `Referer` header, and the host
           serves `Referrer-Policy: same-origin` — which sends NO referrer at
           all cross-origin, so YouTube answers "error 153 — video player
           configuration error" instead of a video. An element-level policy
           overrides the document's, so this frame gets the origin back
           without loosening referrers anywhere else (the portal overlay
           keeps its deliberate `no-referrer`). The `origin` query term on
           the src is a different mechanism — postMessage addressing — and
           does not satisfy this check. Same attribute, same reason, as the
           slides player's embed frame. -->
      <iframe
        [src]="url"
        frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <button class="watch-fab" (click)="$event.stopPropagation(); watchOnYouTube()"
            [title]="'viewer.watchOnYouTube' | t" [attr.aria-label]="'viewer.watchOnYouTube' | t">
      <span class="watch-glyph">open_in_new</span>
      <span class="watch-label">{{ 'viewer.watchOnYouTube' | t }}</span>
    </button>
    <button class="exit-fab" (click)="$event.stopPropagation(); close()"
            [title]="'viewer.close' | t" [attr.aria-label]="'viewer.close' | t">
      <span class="exit-label">{{ 'viewer.close' | t }}</span>
      <span class="exit-glyph">close</span>
    </button>
  </div>
}
