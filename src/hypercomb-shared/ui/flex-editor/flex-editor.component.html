@if (visible()) {
  <aside
    class="fx-panel"
    hcDockInset="right"
    hcDockedPanel="flex-editor"
    [hcSession]="session"
    (hcDockedPanelClose)="close()"
    dockSide="right"
    [minWidth]="240"
    [maxWidth]="460"
    [defaultWidth]="300"
    data-consumes-wheel
    tabindex="-1"
    [attr.aria-label]="'flex.title' | t"
  >
    <header class="fx-header">
      <div class="fx-heading">
        <span class="fx-title">{{ 'flex.title' | t }}</span>
        <span class="fx-subject">{{ layout() }}</span>
      </div>
      <button class="fx-close" type="button" (click)="close()" [attr.aria-label]="'panel.close' | t" [title]="'panel.close' | t">×</button>
    </header>

    <!-- WHICH container this is configuring. The designer lights the same one
         on the canvas; this says it in words. -->
    <p class="fx-where">{{ where() || ('flex.root' | t) }}</p>

    <!-- WHY THERE ARE TWO PLACES. Along and across are in the properties, next
         to the measurements, because they are the two you already know you
         want. This is the GALLERY: every axis, every value, drawn on your own
         container — what you open when you cannot choose between two of them.
         Both write the same variable through the same intent. -->
    <p class="fx-relation">{{ 'flex.gallery' | t }}</p>

    <!-- THE ONLY SCROLLER. Five axes as an accordion: shut, a row says what the
         axis does and what it is set to; open, it shows you. -->
    <div class="fx-shelf">
      @for (axis of axes(); track axis.name) {
        <section class="fx-axis" [class.is-open]="openAxis() === axis.name">
          <button
            type="button"
            class="fx-axis-head"
            [attr.aria-expanded]="openAxis() === axis.name"
            (click)="toggleAxis(axis.name)"
          >
            <span class="fx-axis-name">{{ axis.name }}</span>
            <span class="fx-axis-what">{{ 'flex.axis.' + axis.name | t }}</span>
            <span class="fx-axis-now">{{ current(axis) }}</span>
          </button>

          @if (openAxis() === axis.name) {
            <ul class="fx-values">
              @for (option of axis.values; track option.value) {
                <li>
                  <button
                    type="button"
                    class="fx-option"
                    [class.is-on]="option.active"
                    [attr.aria-label]="axis.name + ': ' + option.value"
                    [attr.aria-pressed]="option.active"
                    (click)="choose(axis.name, option.value)"
                  >
                    <span class="fx-preview" [hcRawHtml]="option.preview"></span>
                    <span class="fx-option-name">{{ option.value }}</span>
                  </button>
                </li>
              }
            </ul>
          }
        </section>
      }
    </div>
  </aside>
}
