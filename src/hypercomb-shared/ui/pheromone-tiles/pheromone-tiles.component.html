@for (panel of panels(); track panel.id) {
  <aside
    class="pheromone-card"
    [class.pinned]="!panel.ephemeral"
    [class.peek]="panel.ephemeral"
    [style.left.px]="panel.pos.x"
    [style.top.px]="panel.pos.y"
    [attr.data-pheromone-tile]="panel.data.label"
    (pointerenter)="onPeekEnter(panel)"
    (pointerleave)="onPeekLeave(panel)"
    (pointerdown)="onPanelFocus(panel)"
    role="dialog"
    [attr.aria-label]="'pheromone.card.title' | t"
  >
    <header
      class="pheromone-card-header"
      [class.static]="panel.ephemeral"
      (pointerdown)="onHeaderDown($event, panel)"
    >
      @if (!panel.ephemeral) {
        <span class="pheromone-grip" aria-hidden="true">⠿</span>
      }
      <span class="pheromone-card-cell">{{ panel.data.label }}</span>
      @if (panel.ephemeral) {
        <button
          class="pheromone-card-pin"
          type="button"
          (click)="pin(panel)"
          (pointerdown)="$event.stopPropagation()"
          [attr.aria-label]="'pheromone.card.pin' | t"
          [attr.title]="'pheromone.card.pin' | t"
        >⌖</button>
      } @else {
        <button
          class="pheromone-card-close"
          type="button"
          (click)="closePanel(panel.id)"
          (pointerdown)="$event.stopPropagation()"
          [attr.aria-label]="'panel.close' | t"
          [title]="'panel.close' | t"
        >×</button>
      }
    </header>

    <ul class="pheromone-chips">
      @for (chip of panel.data.chips; track chip.name) {
        <li class="pheromone-chip">
          <span class="pheromone-chip-swatch" [style.background]="chip.color" aria-hidden="true"></span>
          <span class="pheromone-chip-name">{{ chip.name }}</span>
          <button
            class="pheromone-chip-x"
            type="button"
            (click)="remove(panel, chip)"
            (pointerdown)="$event.stopPropagation()"
            [attr.aria-label]="'pheromone.card.remove' | t: { tag: chip.name }"
            [attr.title]="'pheromone.card.remove.hint' | t"
          >×</button>
        </li>
      }
    </ul>

    @if (panel.ephemeral) {
      <p class="pheromone-card-hint">{{ 'pheromone.card.peek.hint' | t }}</p>
    }
  </aside>
}
