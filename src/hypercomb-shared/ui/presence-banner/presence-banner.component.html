@if (visible()) {
  <div class="presence-wrapper">

    <!-- Initials badge strip: you first, then each peer. Peer badges
         toggle the participant filter; the caret expands the panel. -->
    <div class="badge-strip" role="group" [attr.aria-label]="'presence.panel-label' | t">
      @for (b of badges(); track b.key) {
        @if (b.isSelf && editingName()) {
          <input
            #nameInput
            class="name-input"
            type="text"
            maxlength="64"
            autocomplete="off"
            spellcheck="false"
            [value]="draftName()"
            [placeholder]="'presence.name-placeholder' | t"
            [attr.aria-label]="'presence.set-name' | t"
            (input)="onNameInput($event)"
            (keydown)="onNameKeydown($event)"
            (blur)="commitName()"
            autofocus />
        } @else {
          <button
            class="badge"
            type="button"
            [class.self]="b.isSelf"
            [class.add-name]="b.unnamed"
            [class.selected]="b.selected"
            [style.--presence-identity]="b.color"
            (click)="b.isSelf ? onSelfBadgeClick() : onPeerBadgeClick(b.key)"
            [attr.aria-pressed]="b.isSelf ? null : b.selected"
            [attr.aria-label]="(b.isSelf ? 'presence.set-name' : 'presence.filter-toggle') | t"
            [title]="(b.isSelf ? 'presence.set-name' : 'presence.filter-toggle') | t">
            {{ b.initials }}
          </button>
        }
      }
      @if (!alone()) {
        <button
          class="strip-caret"
          type="button"
          (click)="onCaretClick()"
          [attr.aria-expanded]="expanded()"
          [attr.aria-label]="'presence.expand' | t"
          [title]="'presence.expand' | t">{{ expanded() ? '▴' : '▾' }}</button>
      }
    </div>

    @if (alone()) {
      <span class="presence-caption">{{ 'presence.alone' | t }}</span>
    }

    @if (expanded() && !alone()) {
      <div class="participant-panel" role="dialog" [attr.aria-label]="'presence.panel-label' | t">
        <ul class="participant-list">
          @for (row of rows(); track row.pubkey) {
            <li class="participant-row" [class.selected]="row.selected">
              <button
                class="participant-label"
                type="button"
                (click)="onPeerBadgeClick(row.pubkey)"
                [attr.aria-pressed]="row.selected"
                [title]="'presence.filter-toggle' | t">{{ row.label }}</button>
              <div class="participant-actions">
                <button
                  class="row-toggle subscribe-toggle"
                  type="button"
                  [class.active]="row.subscribed"
                  (click)="onSubscribeToggle(row.pubkey)"
                  [attr.aria-pressed]="row.subscribed"
                  [attr.aria-label]="'presence.subscribe' | t"
                  [title]="'presence.subscribe' | t">
                  <!-- subscribe = data flow = downstream arrow -->
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14M5 12l7 7 7-7"/>
                  </svg>
                </button>
                <button
                  class="row-toggle follow-toggle"
                  type="button"
                  [class.active]="row.following"
                  (click)="onFollowToggle(row.pubkey)"
                  [attr.aria-pressed]="row.following"
                  [attr.aria-label]="'presence.follow' | t"
                  [title]="'presence.follow' | t">
                  <!-- follow = nav sync = footprints / step -->
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                  </svg>
                </button>
              </div>
            </li>
          }
        </ul>
      </div>
    }
  </div>
}
