# hypercomb blossom-worker — public content endpoint (Blossom dialect over R2)
#
# The custom-domain route is attached in the Cloudflare dashboard
# (e.g. content.hypercomb.io/*) — Workers → this worker → Domains & Routes.
# No route/zone config lives here on purpose: the domain is an operator
# decision, the worker is the same everywhere.

name = "hypercomb-content"
main = "worker.js"
compatibility_date = "2026-06-01"

# The public byte address. custom_domain=true has Cloudflare mint the DNS
# record + cert on the jwize.com zone; removing this line and redeploying
# detaches it just as cleanly.
#
# content.jwize.com is a LEGACY write face (jwize 2026-10-03: writes go to a
# zone root). Its route stays forever so installs that have not updated keep
# writing and reading; nothing new is pointed at it. This deployment carries
# no SITE_BINDINGS, so every host it serves is a relay face that takes writes.
routes = [
  { pattern = "content.jwize.com", custom_domain = true },
  # pluginthematrix.io remains the legacy byte fallback. The same worker now
  # serves a pure host door for human routes without changing signed reads or
  # writes on this hostname.
  { pattern = "pluginthematrix.io", custom_domain = true }
]

# R2 bucket holding the flat sig heap: one object per sig, key == sig,
# Content-Type in httpMetadata. Create before first deploy:
#   wrangler r2 bucket create hypercomb-content
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "hypercomb-content"

# KV guest list: GRANTS[pubkey] → { quotaBytes, usedBytes, expiresAt }.
# Create and paste the id:
#   wrangler kv namespace create GRANTS
[[kv_namespaces]]
binding = "GRANTS"
id = "11e24dcda743413ab24397e936671641"

# KV hive pointers: HIVES[pubkey] → signed kind-30564 index event mapping
# the publisher's public lineage keys to their current head sigs.
# Create and paste the id before deploying:
#   wrangler kv namespace create HIVES
[[kv_namespaces]]
binding = "HIVES"
id = "186c91f7458b421abea02d7647f27821"

[vars]
HOST_DOOR_ORIGIN = "https://hypercomb-host.pages.dev"
HOST_DOOR_HOSTS = "pluginthematrix.io"
# WHO GETS BYTES (jwize 2026-10-11: "we can't give hosting away for free").
# AUTO_GRANT "0": no stranger's key is minted a grant. This deployment binds
# no sites, so its people (worker.js hostPeople) are HOST_FRIENDS alone; every
# other key uploads only on a grant it already holds, until that grant's own
# expiry and at most at the guest ceiling (DEFAULT_QUOTA_BYTES) —
# pluginthematrix-core opens a fresh window for its people when one lapses,
# and the ledger is shared. List the operator's own keys in HOST_FRIENDS here
# too, or they upload here at the guest ceiling. It shares the bucket and the ledger with
# pluginthematrix-core: keep AUTO_GRANT "0" on both, or a key minted here
# uploads there too.
# OPEN UNTIL IT IS ADOPTED (jwize, 2026-10-12: "let's leave it open until it is
# adopted"): the guest list stays on. Set "0" to keep bytes for the host's
# people only (operators, bound publishers, HOST_FRIENDS) — on BOTH scripts.
AUTO_GRANT = "1"
HOST_FRIENDS = ""                   # comma-separated 64-hex pubkeys the host is shared with (public keys only)
PEOPLE_QUOTA_BYTES = "1073741824"   # 1 GiB for each of the host's people per GRANT_TTL_DAYS window (a lapsed window refills)
DEFAULT_QUOTA_BYTES = "104857600"   # 100 MB per guest, under AUTO_GRANT "1" only
GRANT_TTL_DAYS = "90"               # grants lapse; only AUTO_GRANT "1" re-mints them

# ── host AI (POST /ai/ask) ──
# The API key is a SECRET, never a var:  wrangler secret put ANTHROPIC_API_KEY
# Until that secret exists the route answers 503 and costs nothing.
AI_MODEL = "claude-haiku-4-5"       # the immediate tier — fast + cheap
AI_MAX_TOKENS = "1024"              # reply ceiling per ask
AI_DAILY_TOKENS = "100000"          # per-pubkey daily estimate ceiling (open mode)
AI_WRITERS = ""                     # comma-separated pubkeys; set to lock /ai/ask to your own keys
