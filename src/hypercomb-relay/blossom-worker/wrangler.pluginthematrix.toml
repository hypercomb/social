# Plugin the Matrix — independent public relay + read-only Core hosts.
#
# This deployment intentionally owns no jwize.com route. The relay hostname
# accepts authenticated publisher writes; application hostnames are bound in
# SITE_BINDINGS and worker.js rejects every non-GET/HEAD request on them.

name = "pluginthematrix-core"
main = "worker.js"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "content.pluginthematrix.com", custom_domain = true },
  { pattern = "pluginthematrix.com", custom_domain = true },
  { pattern = "revolucion.pluginthematrix.com", custom_domain = true },
  # Nested-lineage site: the implicit wildcard rule only maps a label to a
  # TOP-LEVEL lineage, so a page living under another creation needs its own
  # custom domain + explicit SITE_BINDINGS entry naming the full lineage key.
  { pattern = "meetup.pluginthematrix.com", custom_domain = true },
  { pattern = "arkanoid.pluginthematrix.com", custom_domain = true },
  # Every participant name resolves here (subdomain IS the hive name). A
  # proxied wildcard DNS record (* CNAME pluginthematrix.com) must exist in
  # the zone; unbound names get the worker's "nothing here" page.
  { pattern = "*.pluginthematrix.com/*", zone_name = "pluginthematrix.com" },
  # Second zone, same script — WILDCARD ONLY. No apex custom domain and no
  # named host: a trusted host offers every participant the same door and
  # plays favourites with none, so the only route is the wildcard. The zone
  # carries one record, a proxied `* CNAME realones.online`. Proxying is what
  # makes that work with no apex record at all: the DNS answer is Cloudflare's
  # own anycast address, and this route claims every request before the edge
  # would ever dial the named origin. Route the apex later and it resolves too.
  # realones.online still needs a SITE_BINDINGS key below: resolveSite finds a
  # label's zone by matching the bound suffix, so without it every
  # *.realones.online name is unroutable. Deploying this route before the zone
  # is ACTIVE in the account fails the WHOLE deploy — every other host with it.
  # DISABLED 2026-08-30 — realones.online is PENDING in Cloudflare: its
  # nameservers were never moved at its registrar (public resolvers SERVFAIL,
  # the zone has a wildcard CNAME and no apex). A `zone_name` route naming a
  # zone that is not ACTIVE fails the ENTIRE deploy, which would take every
  # hostname in this file down with it — so one dormant domain must never be
  # able to hold the live ones hostage. Re-enable the moment the zone reads
  # Active; nothing else about it needs to change.
  # { pattern = "*.realones.online/*", zone_name = "realones.online" },
  # THIRD ZONE — hypercomb.com. Same script, same bindings: one worker serves
  # every zone, so a new domain is routes + SITE_BINDINGS and nothing else.
  # Zone ACTIVE 2026-08-30 (registrar NS moved to jack/margaret) with a
  # proxied `* CNAME hypercomb.com` for the wildcard. WILDCARD ONLY for now:
  #
  #   • The apex custom domain is deliberately NOT routed yet. The zone still
  #     carries the imported `A hypercomb.com → Azure` record, so the apex
  #     keeps serving the old Azure site until the `hypercomb` lineage is
  #     published and the cutover is chosen — routing it today would replace
  #     a working site with "nothing published here" AND collide with that
  #     A record at deploy time.
  #   • replication.hypercomb.com waits with it: its nested lineage
  #     (hypercomb/architecture/replication-by-signature) is not published
  #     yet either. Uncomment both together at cutover.
  #
  # { pattern = "hypercomb.com", custom_domain = true },
  # { pattern = "replication.hypercomb.com", custom_domain = true },
  { pattern = "*.hypercomb.com/*", zone_name = "hypercomb.com" }
]

[assets]
directory = "../../hypercomb-web/dist/hypercomb-web/visitor"
binding = "ASSETS"

# Workers Free allows 100,000 requests/DAY across the account, and every
# hostname here is served by this one script — so when the cap is hit, every
# site dies at once and only recovers at UTC midnight. `run_worker_first = true`
# billed EVERY static asset (bundles, theme art, images) as a Worker
# invocation; one page load cost ~135 requests, ~40 of them pure static. The
# asset server answers the negated paths directly, off the quota entirely.
#
# The list is deliberately EXPLICIT rather than extension globs: `*` matches
# slashes, so a rule like `!/*.png` would also swallow `/@resource/<sig>/art.png`
# and serve R2-backed content as a missing static file.
#
# Everything NOT negated still runs the Worker first — `/` (so the implicit-site
# "nothing published here" check and the page CSP are unchanged), bare
# `/<sig>`, `/@resource/*`, `/content/*`, `/site.json`, `/publications.json`,
# `/hive/*`, `/upload`, `/grant`, `/ai/ask`. Security headers for the negated
# paths live in hypercomb-web/public/_headers.
run_worker_first = [
  "/*",
  "!/chunk-*.js",
  "!/main-*.js",
  "!/worker-*.js",
  "!/polyfills-*.js",
  "!/styles-*.css",
  "!/substrate/*",
  "!/vendor/*",
  "!/core/*",
  "!/media/*",
  "!/tracks/*",
  "!/env.js",
  "!/splash.js",
  "!/pixi.js",
  "!/hypercomb-core.runtime.js",
  "!/hypercomb.worker.js",
  "!/example-hives.json",
  "!/manifest.webmanifest",
  "!/staticwebapp.config.json",
  "!/favicon.ico",
  "!/icon.svg",
  "!/external.png",
  "!/external.svg",
  "!/house.png",
  "!/local.png",
  "!/local.svg",
  "!/local-flat.svg",
  "!/spw.png",
  "!/unnamed.jpg",
]

# One immutable signature heap shared by the relay and every application host.
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "hypercomb-content"

[[kv_namespaces]]
binding = "GRANTS"
id = "11e24dcda743413ab24397e936671641"

[[kv_namespaces]]
binding = "HIVES"
id = "186c91f7458b421abea02d7647f27821"

[vars]
AUTO_GRANT = "1"
DEFAULT_QUOTA_BYTES = "104857600"
GRANT_TTL_DAYS = "90"
AI_MODEL = "claude-haiku-4-5"
AI_MAX_TOKENS = "1024"
AI_DAILY_TOKENS = "100000"
AI_WRITERS = ""

# The relay hostname is deliberately absent: it must retain signed PUT routes.
#
# realones.online is a ZONE ANCHOR, not a site: it exists so resolveSite can
# find the zone behind a `<label>.realones.online` request, and its apex is
# never routed. Its lineage is deliberately the unreachable key
# "realones.online" — lineageKey folds every non-alphanumeric character to `-`,
# so no hive location can ever mint a lineage containing a dot. A plausible
# anchor lineage like "realones" would instead sit in the publications ledger's
# `named` set and silently deny a real hive of that name its plate.
SITE_BINDINGS = '{"pluginthematrix.com":{"title":"Plugin the Matrix","lineage":"pluginthematrix","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"revolucion.pluginthematrix.com":{"title":"Revolución","lineage":"revolucion","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"meetup.pluginthematrix.com":{"title":"Meetup","lineage":"revolucion/meetup","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"arkanoid.pluginthematrix.com":{"title":"Arkanoid","lineage":"games/arkanoid","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"realones.online":{"title":"Real Ones","lineage":"realones.online","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"hypercomb.com":{"title":"Hypercomb","lineage":"hypercomb","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]},"replication.hypercomb.com":{"title":"Replication by Signature","lineage":"hypercomb/architecture/replication-by-signature","publishers":[{"pubkey":"eacc0e65aeed6d421d12141b04f4cd47e2926ee470a835505c0a5ad2f1f75a9a","label":"Jaime","primary":true}]}}'