[workspace]
resolver = "2"
members = ["crates/protocol", "crates/store", "crates/host", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
hypercomb-protocol = { path = "crates/protocol" }
hypercomb-store = { path = "crates/store" }
hypercomb-host = { path = "crates/host" }
redb = "2"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
