<!doctype html>
<html lang="en" data-hypercomb-mode="visitor">
  <head>
    <meta charset="utf-8" />
    <title>Hypercomb</title>
    <base href="/" />

    <!-- A VISITOR KEEPS NOTHING. Its hive already lives in memory for the
         length of the page (memory-filesystem.ts); its settings now do too.
         Before this, every visit left a dozen hive settings in the browser —
         a generated signing key among them — and the next visit read them
         back, so a reader who knows nothing of Hypercomb carried a stable
         identity and leftovers between refreshes (jwize, 2026-09-30: visitors
         are transparent and reset on refresh). Both storages are replaced
         here, before any script runs, with ones that end with the page.
         What earlier visits left in the real storage is never read again.

         Two consequences, both by design: no cached import map (the visitor
         resolves dependencies to blob: URLs that die with the page, so a
         replayed map was a map of dead specifiers — the old reason this
         script existed), and `hc:verbose` is the one key carried in, read
         from the real storage, so a published site can still be debugged. -->
    <script>
      (function () {
        var verbose = null;
        try { verbose = window.localStorage.getItem('hc:verbose'); } catch (error) {}
        function pageStorage(seed) {
          var data = new Map(seed);
          return {
            get length() { return data.size; },
            key: function (index) { var keys = Array.from(data.keys()); return index < keys.length ? keys[index] : null; },
            getItem: function (key) { key = String(key); return data.has(key) ? data.get(key) : null; },
            setItem: function (key, value) { data.set(String(key), String(value)); },
            removeItem: function (key) { data.delete(String(key)); },
            clear: function () { data.clear(); }
          };
        }
        try {
          Object.defineProperty(window, 'localStorage', { configurable: true, value: pageStorage(verbose ? [['hc:verbose', verbose]] : []) });
          Object.defineProperty(window, 'sessionStorage', { configurable: true, value: pageStorage([]) });
        } catch (error) {}
      })();
    </script>
    <!-- ONE CORE: the shell imports the same @hypercomb/core module every bee
         imports (angular.json externalDependencies), mapped before any module
         script so both the polyfills and main resolve it. -->
    <script type="importmap">{ "imports": { "@hypercomb/core": "/hypercomb-core.runtime.js" } }</script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090c" />

    <!-- The mark answers on every published door. A site is a Hypercomb
         creation wherever it is served from, so the hexagon is the DEFAULT
         tab icon on every subdomain and custom domain — the browser's blank
         globe says nothing true about the page. Built by
         `node scripts/build-favicons.cjs`; the files ride the visitor build's
         own asset root, so they are same-origin on every host (see
         documentation/no-third-party-requests.md).

         A site that wants its OWN icon says so in its descriptor: site.json
         may carry `icon`, a same-origin absolute path (typically a
         content-addressed `/<sig>/name.svg`), and main.visitor.ts REPLACES
         these links at boot. Absent that, the mark stands. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,body{margin:0;width:100%;height:100%;background:#08090c}
      /* A plain cover, no animation: a published site opens straight onto
         itself. The cover only hides the engine's own visuals (rings, the
         empty prompt) until the site is up — main.visitor.ts fades it. */
      .site-loading{position:fixed;inset:0;background:#08090c}
    </style>
  </head>
  <body>
    <script src="env.js"></script>
    <app-root><div class="site-loading" role="status" aria-label="Loading website"></div></app-root>
  </body>
</html>
