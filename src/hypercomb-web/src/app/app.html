@if(showHeader){
<div class="header-bar" [class.input-open]="inputOpen()" [style.visibility]="(viewActive() || viewMode() === 'website') ? 'hidden' : null">
  <app-header></app-header>
  <hc-mesh-header></hc-mesh-header>
</div>
}
<router-outlet></router-outlet>
<!-- The Pixi canvas host (#pixi-host) is NOT a template node: the pixi worker
     MINTS it onto <body> (position:fixed, z-index:59989, pointer-events:none)
     at boot — the renderer owns its own DOM contract. It is hidden in website
     mode by the GLOBAL `body.hc-view-website #pixi-host{,canvas}` rule in
     styles.scss (body-descendant selectors reach the minted node) using
     visibility (NOT display:none, which collapses it to 0×0 and corrupts
     scale/zoom) plus pointer-events:none on the <canvas>. -->
<hc-controls-bar></hc-controls-bar>
<div class="update-status-dock">
  <hc-upgrade-indicator></hc-upgrade-indicator>
  <hc-sync-indicator></hc-sync-indicator>
</div>
<hc-edit-actions></hc-edit-actions>
<!-- Every other shell surface is registry-fed: registered in
     shared/ui/shell-surfaces/shell-surfaces.barrel.ts, mounted here in `order`
     order. Never add an <hc-*> tag below — add a registration to the barrel. -->
<hc-shell-surfaces></hc-shell-surfaces>
@if (installNeeded()) {
<div class="install-prompt" role="dialog" aria-modal="true" aria-labelledby="install-title">
  <div class="install-card">
    <h2 id="install-title">{{ 'install.title' | t }}</h2>
    @if (storageBlocked()) {
      <p class="install-blocked">{{ 'install.storage-blocked' | t }}</p>
    } @else if (updateNeeded()) {
      <p class="install-blocked">{{ 'install.update-needed' | t }}</p>
    } @else {
      <button class="install-cta" type="button" (click)="startWelcome()" [disabled]="upgrading()">
        @if (upgrading()) { {{ 'install.starting' | t }} } @else { {{ 'install.start' | t }} }
      </button>
      <!-- "Starting…" with nothing under it is indistinguishable from a hang.
           The install already reports phase/current/total; showing it is the
           difference between "working" and "stuck". -->
      @if (upgrading() && installProgress()) {
        <p class="install-progress">{{ installProgress() }}</p>
      }
    }
  </div>
</div>
}
