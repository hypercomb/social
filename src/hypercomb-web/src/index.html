<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hypercomb</title>
    <base href="/" />

    <!-- interactive-widget=resizes-content: keyboard shrinks the layout viewport
         (Android) so bottom-anchored chrome rides above it. viewport-fit=cover
         exposes safe areas while browser zoom remains user-controlled.
         BEFORE EVERY SCRIPT: until a phone has read this tag its layout
         viewport is 980px wide, so the phone test after the import map
         could never match. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Break capture: every client-side break is queued for the break repair
         loop (documentation/break-repair-loop.md). The listeners go on HERE,
         before any stylesheet, script or module can fail, and only hold what
         they see: essentials' assistant/break-capture.drone.ts takes the buffer
         over when it loads. Only candidates are held — a console call carrying
         an Error, a script or stylesheet that failed, a runtime error — so
         noise cannot fill the slots, and a warning is held only while half the
         buffer is free for breaks. The array is the flag: whichever side runs
         first installs the listeners, never both. Mirrored in
         hypercomb-dev/src/index.html. -->
    <script>
      (function () {
        if (Array.isArray(window.__hcBreaks)) return;
        var held = (window.__hcBreaks = []);
        var errorLike = function (v) {
          return v instanceof Error || (!!v && typeof v === 'object' && typeof v.stack === 'string' && typeof v.message === 'string');
        };
        var candidate = function (kind, detail) {
          if (kind === 'reported' || kind === 'warned') return Array.isArray(detail) && detail.some(errorLike);
          if (kind === 'error') {
            var tag = detail && detail.target && detail.target.tagName;
            return typeof tag !== 'string' || /^(SCRIPT|LINK)$/i.test(tag);
          }
          return true;
        };
        // Everything inside take() is guarded: an argument that throws when
        // inspected (a revoked Proxy, a cross-origin window, a throwing getter)
        // must never turn a console call into an exception in its caller.
        var take = function (kind, detail) {
          try {
            var at = Date.now();
            if (typeof window.__hcBreak === 'function') { window.__hcBreak(kind, detail, at); return; }
            if (candidate(kind, detail) && held.length < (kind === 'warned' ? 50 : 100)) held.push([kind, detail, at]);
          } catch (e) {}
        };
        window.addEventListener('error', function (e) { take('error', e); }, true);
        window.addEventListener('unhandledrejection', function (e) { take('rejection', e.reason); });
        var report = console.error.bind(console);
        console.error = function () { var args = Array.prototype.slice.call(arguments); report.apply(null, args); take('reported', args); };
        var warn = console.warn.bind(console);
        console.warn = function () { var args = Array.prototype.slice.call(arguments); warn.apply(null, args); take('warned', args); };
      })();
    </script>

    <!-- Import map pre-apply: MUST run before any module script load is
         triggered. Angular's own `main.js` is a module script, so a map
         appended from inside main.ts is always "late": Chrome/Edge 133+ merge
         late maps, but Safari and older Chrome DROP them — every bare
         specifier a bee or dependency imports then throws "Failed to resolve
         module specifier '@domain.com/namespace'". The map is derived from
         OPFS (async, can't happen here), so main.ts caches the resolved JSON
         under 'hc:importmap' and this synchronous classic script replays it on
         the next boot, before the module graph starts. main.ts compares what
         landed here against a fresh OPFS resolve and reloads once if the cache
         was stale. -->
    <!-- ONE CORE. The shell no longer compiles @hypercomb/core into its own
         bundle (angular.json externalDependencies): it imports the very module
         every bee imports, so each service core makes exists once. The map
         therefore ALWAYS carries the core entry, cache or no cache, and it is
         written as ONE map — a browser that takes only the first map must not
         lose the cached one to it. -->
    <script>
      (function () {
        var CORE = { '@hypercomb/core': '/hypercomb-core.runtime.js' };
        var raw = null;
        var map = { imports: CORE };
        // The cached map points every dependency at /opfs/, which only the
        // service worker answers. A page the worker does not control (a hard
        // reload, DevTools "bypass for network", a browser without workers)
        // would send those imports to the host, whose SPA catch-all answers
        // text/html — and an early entry can never be overridden by a later
        // map. So an uncontrolled page replays nothing: main.ts derives a
        // self-typed blob map for it (resolve-import-map.ts) and appends it.
        var controlled = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
        try {
          raw = controlled ? localStorage.getItem('hc:importmap') : null;
          var parsed = raw ? JSON.parse(raw) : null;
          if (parsed && typeof parsed.imports === 'object' && parsed.imports) {
            parsed.imports['@hypercomb/core'] = CORE['@hypercomb/core'];
            map = parsed;
          } else {
            raw = null;
          }
        } catch (e) { raw = null; }
        var s = document.createElement('script');
        s.type = 'importmap';
        s.textContent = JSON.stringify(map);
        document.head.appendChild(s);
        if (raw) window.__hcImportMapApplied = raw;
      })();
    </script>

    <!-- Theme pre-paint: reflect the stored theme onto <html> before first
         paint so there's no flash. ThemeService (@hypercomb.social/Theme) owns
         it thereafter. Boots dark when no preference is stored; 'system' clears
         the attribute and follows prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hc:theme');
          var el = document.documentElement;
          if (t === 'system') el.removeAttribute('data-theme');
          else el.setAttribute('data-theme', t || 'honey');
        } catch (e) {}
      })();
    </script>

    <!-- hc-phone-gateway. A phone at hypercomb.io is the gateway
         (documentation/using-a-creation.md, "On a phone, hypercomb.io is the
         gateway"). It stays on this origin and runs the bootstrap signature
         hypercomb.com publishes at /pin right now — the signed initial, the
         same bytes the .com runs, verified before they are imported. That
         initial is the simplified installer: connect and follow hosts here;
         a creation opens on its own domain. The hive's mobile view stays set
         aside. Desktop, local dev, the development deploy and every other
         host keep the hive. The pin is read, never written into this file.
         This script follows the import map because that module's only bare
         import is @hypercomb/core, and it follows the theme stamp so the
         panel inherits the honey tokens. A miss, a bad hash or a boot that
         throws leaves the promise false and main.ts boots the hive. Nothing
         redirects. Decided once, at load. -->
    <script>
      (function () {
        function phoneGatewayHost(host) {
          return host === 'hypercomb.io' || host === 'www.hypercomb.io';
        }
        function parsePin(text) {
          var pin = String(text || '').trim().toLowerCase();
          return /^[a-f0-9]+$/.test(pin) && pin.length === 64 ? pin : '';
        }
        function sha256Hex(bytes) {
          return crypto.subtle.digest('SHA-256', bytes).then(function (digest) {
            var view = new Uint8Array(digest);
            var hex = '';
            for (var i = 0; i < view.length; i++) {
              var b = view[i].toString(16);
              hex += b.length === 1 ? '0' + b : b;
            }
            return hex;
          });
        }
        function whenBody() {
          if (document.body) return Promise.resolve();
          return new Promise(function (resolve) {
            document.addEventListener('DOMContentLoaded', function () { resolve(); }, { once: true });
          });
        }
        async function servePinnedInitial(importer) {
          var origin = 'https://hypercomb.com';
          var load = importer || function (url) { return import(url); };
          var fetchInit = { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' };
          try {
            var pinRes = await fetch(origin + '/pin', fetchInit);
            if (!pinRes.ok) return false;
            var pin = parsePin(await pinRes.text());
            if (!pin) return false;
            var byteRes = await fetch(origin + '/' + pin, fetchInit);
            if (!byteRes.ok) return false;
            var bytes = await byteRes.arrayBuffer();
            if (await sha256Hex(bytes) !== pin) return false;
            var url = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
            try {
              var module = await load(url);
              if (!module || typeof module.boot !== 'function') return false;
              var acquisition = module.boot({ reason: 'cold' });
              if (!acquisition || typeof acquisition.prompt !== 'function') return false;
              await whenBody();
              acquisition.prompt();
              // The genesis splash keeps a canvas worker until its own dismiss
              // runs. Removing the node alone leaves that worker drawing.
              if (typeof window.__hcDismissSplash === 'function') window.__hcDismissSplash();
              else {
                var splash = document.getElementById('hc-splash');
                if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
              }
              return true;
            } catch (runError) {
              var hung = document.querySelector('hc-shim-hosts');
              if (hung && hung.parentNode) hung.parentNode.removeChild(hung);
              return false;
            } finally {
              URL.revokeObjectURL(url);
            }
          } catch (loadError) {
            return false;
          }
        }
        try {
          if (!phoneGatewayHost(location.hostname)) return;
          if (!matchMedia('(pointer: coarse)').matches) return;
          if (!matchMedia('(max-width: 599px), (max-height: 449px)').matches) return;
          window.__hcPhoneGateway = servePinnedInitial().then(function (ok) {
            if (!ok) console.warn('[phone-gateway] the pinned initial did not run; the hive will boot');
            return ok;
          });
        } catch (e) {}
      })();
    </script>

    <!-- Renderer recovery: deployed participants can keep an older
         show-cell bee in OPFS after the shell updates. That version treated an
         unset readiness-shade preference as ON and could leave every tile
         dark indefinitely. Stamp the new safe default before any module (or
         cached bee) evaluates the flag; an explicit participant choice is
         preserved. New renderers also understand '0' as off. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('hc:tile-shade') === null) {
            localStorage.setItem('hc:tile-shade', '0');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Renderer recovery: deployed participants can keep an older
         show-cell bee in OPFS after the shell updates. That version treated an
         unset readiness-shade preference as ON and could leave every tile
         dark indefinitely. Stamp the new safe default before any module (or
         cached bee) evaluates the flag; an explicit participant choice is
         preserved. New renderers also understand '0' as off. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('hc:tile-shade') === null) {
            localStorage.setItem('hc:tile-shade', '0');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Built by `node scripts/build-favicons.cjs` from one master mark; the
         .ico carries 16/32/48 for the tab, the .svg is what modern browsers
         actually pick and scales to any density. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- PWA: installable to a phone home screen, launches standalone. The
         service worker (hypercomb.worker.js) is an OPFS module server, not an
         app-shell cache, so install-ability rides on this manifest alone. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hypercomb" />
    <!-- iOS ignores SVG here and flattens transparency unpredictably, so this
         is the opaque PNG rendering with the mark inset in the safe zone. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Inter, self-hosted. NOTHING here may point at a third-party origin —
         an off-origin font/script/style hands that host the visitor's IP, UA
         and Referer on every page load. See
         documentation/no-third-party-requests.md. Regenerate the woff2 with
         `node scripts/fetch-fonts.cjs hypercomb-web/public/fonts inter source-serif material-symbols`
         — name EVERY family the shell ships: the script deletes the ones
         you leave out. -->
    <link rel="stylesheet" href="fonts/fonts.css?v=27fca15474" />

    <!-- Loading-page (genesis splash) styles — in <head> so they survive the
         re-parent out of <app-root> that keeps the splash up until tiles paint. -->
    <style>
      #hc-splash{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:radial-gradient(120% 90% at 50% 42%,#0c1018 0%,#05060a 60%,#030409 100%)}
      #hc-splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
      #hc-splash .m{position:absolute;left:0;right:0;top:calc(66% + 30px);text-align:center;color:#dfe8f0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:clamp(15px,2.76vw,23px);letter-spacing:.62em;text-indent:.62em;font-weight:600;pointer-events:none;user-select:none}
    </style>
  </head>
  <body>
    <script src="env.js"></script>
    <app-root>
      <!-- Loading page: genesis animation. Paints instantly; splash.js re-parents
           #hc-splash to <body> so it survives bootstrap, then dismisses when the
           first tiles paint. Styles live in <head> so they persist after the move. -->
      <div id="hc-splash" aria-hidden="true">
        <canvas id="hc-splash-cv"></canvas>
        <div class="m">hypercomb</div>
      </div>
      <script src="splash.js"></script>
    </app-root>
  </body>
</html>
