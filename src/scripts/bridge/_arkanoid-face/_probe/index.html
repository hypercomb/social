<!doctype html><html><head><meta charset="utf-8"><title>ark render probe</title>
<style>body{margin:0;background:#0a0826;font:13px monospace;color:#7f7}
.row{display:flex;gap:10px;padding:8px}
canvas{border-radius:12px;background:#10204f;box-shadow:0 0 0 1px rgba(61,240,255,.45)}
#out{padding:6px 10px;white-space:pre}</style></head>
<body><div class="row"><canvas id="a"></canvas><canvas id="b"></canvas></div><div id="out">…</div>
<script src="bundle.js"></script>
<script>
  window.addEventListener('load', function(){
    var one = window.draw('a', 0)
    var two = window.draw('b', 47)
    document.getElementById('out').textContent = one + '\n' + two
  })
</script></body></html>
