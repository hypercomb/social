<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Meetup agendas</title>
<meta name="description" content="The next Hypercomb meetup agenda. Pull it up, or the list, and every date is a row.">
<style>
  /* The home opens on the default agenda — the nearest upcoming date, else
     the latest — full screen, in the meetings dark look. Pulling up, or the
     list icon, collapses it into the list's top row the way a card collapses
     into its row. A row grows back into that agenda. The date's own page is
     still the layout resource. Card text comes from the child's parameter,
     then from the parent's list. Opening the page never creates the pool.
     Scoped under .ag so a hive mounting the page inline never touches its shell.
     The dark tokens are the meetings page's, locked: first paint does not
     wait on a media query. */
  .ag{
    --mp-outer:#121110;--mp-bg:#1b1a19;--mp-surface:#2c2a29;--mp-text:#f1efee;
    --mp-accent:#ff5a3d;--mp-strong:#ff8a72;--mp-muted:#a8a4a3;--mp-soft:#cfcbca;
    --mp-divider:rgba(241,239,238,.28);--mp-hover:rgba(241,239,238,.06);
    --mp-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:block;min-height:100vh;min-height:100dvh;background:var(--mp-outer);color:var(--mp-text);
    font:400 16px/1.55 var(--mp-font);-webkit-font-smoothing:antialiased;text-wrap:pretty;color-scheme:dark}
  body:has(> .ag){margin:0;background:var(--mp-outer,#121110);color-scheme:dark}
  .ag *,.ag *::before,.ag *::after{box-sizing:border-box}
  .ag :focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px}
  .ag ::selection{background:rgba(255,90,61,.35)}
  .ag .app{max-width:760px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--mp-bg)}
  @media (min-width:762px){.ag .app{border-left:1px solid var(--mp-divider);border-right:1px solid var(--mp-divider)}}
  .ag header.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));
    background:var(--mp-bg);border-bottom:2px solid var(--mp-divider)}
  .ag .brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .ag .brand em{font-style:normal;color:var(--mp-accent)}
  .ag .list-btn{width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--mp-divider);background:transparent;color:var(--mp-text)}
  .ag .list-btn:hover{background:var(--mp-hover)}
  .ag .list-btn[aria-pressed="true"]{color:var(--mp-strong);border-color:var(--mp-accent)}
  .ag .stage{display:block}
  .ag[data-view="list"] .stage{display:none}
  .ag .listview{display:block;padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
  .ag[data-view="agenda"] .listview{display:none}
  .ag .kicker{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mp-strong);font-weight:600}
  .ag .search{display:block;position:sticky;top:64px;z-index:1;width:100%;min-height:44px;margin:12px 0;
    padding:9px 11px;border:1px solid var(--mp-divider);background:var(--mp-bg);color:var(--mp-text);font:inherit}
  .ag .search::placeholder{color:var(--mp-muted)}
  .ag .rows{list-style:none;margin:0;padding:0;display:grid;border-top:2px solid var(--mp-divider)}
  .ag .rows button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;
    width:100%;min-height:44px;padding:12px 4px;border:0;border-bottom:1px solid var(--mp-divider);
    background:transparent;color:var(--mp-text);font:inherit;text-align:left;cursor:pointer}
  .ag .rows button:hover{background:var(--mp-hover)}
  .ag .rows b{grid-column:1;font-weight:800;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ag .rows .when{grid-row:1 / 3;grid-column:2;font-weight:600;font-size:13px;color:var(--mp-strong);white-space:nowrap}
  .ag .rows .meta{grid-column:1;font-size:12px;color:var(--mp-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ag .rows button.sel b{color:var(--mp-strong)}
  .ag .none{color:var(--mp-muted);text-align:center;padding:26px 10px;font-size:.9rem}
  .ag .panel{display:block;padding:20px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left));border-top:2px solid var(--mp-divider)}
  .ag .panel.lead{border-top:0}
  .ag h1{font-size:clamp(28px,7.5vw,40px);line-height:1.05;letter-spacing:-.02em;font-weight:800;margin:4px 0 0}
  .ag h2{font-size:20px;line-height:1.15;font-weight:800;margin:0}
  .ag .mini{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mp-muted)}
  .ag .sub{font-size:14px;color:var(--mp-soft);margin-top:8px}
  .ag .facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:2px solid var(--mp-divider);margin-top:16px}
  .ag .facts > div{padding:8px 12px 8px 0}
  .ag .facts > div + div{padding:8px 0 8px 12px;border-left:1px solid var(--mp-divider)}
  .ag .big{font-weight:800;font-size:19px;line-height:1.15;margin-top:2px}
  .ag .facts .sub{margin-top:2px;font-size:13px}
  .ag .bring{border-top:1px solid var(--mp-divider);padding-top:12px;margin-top:12px;font-size:15px;color:var(--mp-soft)}
  .ag .bring b{color:var(--mp-text);font-weight:800}
  .ag .show{list-style:none;margin:12px 0 0;padding:0;border-top:2px solid var(--mp-divider)}
  .ag .show li{display:grid;grid-template-columns:3.3em minmax(0,1fr) auto;gap:0 12px;align-items:baseline;
    padding:12px 4px;border-bottom:1px solid var(--mp-divider)}
  .ag .show time{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .ag .show b{display:block;font-weight:800;font-size:16px;line-height:1.25}
  .ag .show .note{display:block;font-size:14px;line-height:1.45;color:var(--mp-soft);margin-top:3px}
  .ag .show .min{font-size:13px;font-weight:600;color:var(--mp-strong);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ag .show li.end{border-bottom:0}
  .ag .show li.end b{color:var(--mp-strong)}
  .ag .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion: reduce){
    .ag .stage{transition:none}
  }
</style>
</head>
<body>
<div class="ag" data-view="agenda">
<div class="app">
  <header class="top">
    <span class="brand">Hypercomb <em>Meetup</em></span>
    <button type="button" class="list-btn" data-list aria-pressed="false" aria-label="All agendas">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2"></path>
      </svg>
    </button>
  </header>
  <section class="stage" data-stage aria-live="polite"></section>
  <section class="listview" data-listview hidden>
    <p class="kicker">Agendas</p>
    <p class="sr" data-count role="status"></p>
    <label class="sr" for="ag-q">Search agendas</label>
    <input class="search" id="ag-q" type="search" placeholder="Search dates" data-search>
    <ul class="rows" data-rows></ul>
    <p class="none" data-empty hidden>No agendas yet.</p>
    <p class="none" data-nomatch hidden>Nothing matches.</p>
  </section>
</div>
</div>
<script>
(function () {
  var roots = document.querySelectorAll('.ag:not([data-ready])');
  var root = roots[roots.length - 1];
  if (!root) return;
  root.setAttribute('data-ready', '');
  var $ = function (sel) { return root.querySelector(sel); };
  var SIG = /^[0-9a-f]{64}$/;
  var DATE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var HISTORY = '@diamondcoreprocessor.com/HistoryService';
  var STORE = '@hypercomb.social/Store';
  var state = { rows: [], q: '', selected: '', view: 'agenda', busy: false, touched: false };

  function ioc(key) {
    try { return window.ioc && window.ioc.get && window.ioc.get(key); } catch (e) { return null; }
  }
  function sha256(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function longDate(iso) {
    var m = DATE.exec(iso);
    if (!m) return '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.toLocaleDateString('en', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }
  function bases() {
    var out = [];
    if (/^https?:$/.test(location.protocol)) out.push(location.origin);
    if (location.host !== 'agenda.hypercomb.com') out.push('https://agenda.hypercomb.com');
    return out;
  }
  function textAt(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (res) { return res.ok ? res.text() : ''; }, function () { return ''; });
  }
  function jsonAt(url) {
    return textAt(url).then(function (text) { try { return text ? JSON.parse(text) : null; } catch (e) { return null; } });
  }
  function resourceText(sig) {
    // A 200 is not the bytes: the hive shell answers every path. Keep a
    // network body only when it hashes to the signature it was asked by.
    var net = function () {
      return bases().reduce(function (p, base) {
        return p.then(function (found) {
          if (found) return found;
          return textAt(base + '/' + sig).then(function (text) {
            if (!text) return '';
            return sha256(text).then(function (h) { return h === sig ? text : ''; });
          });
        });
      }, Promise.resolve(''));
    };
    var store = ioc(STORE);
    // Raw bytes first. getResource follows a resource hop and would hide a
    // meta that carries the agenda JSON on data.
    var local = store && store.getResourceLocal
      ? Promise.resolve(store.getResourceLocal(sig)).then(function (blob) {
          return blob && blob.text ? blob.text() : '';
        }, function () { return ''; })
      : Promise.resolve('');
    return local.then(function (text) {
      if (text) return text;
      return net().then(function (found) {
        if (found) return found;
        if (!store || !store.getResource) return '';
        return Promise.resolve(store.getResource(sig)).then(function (blob) {
          return blob && blob.text ? blob.text() : '';
        }, function () { return ''; });
      });
    });
  }
  function resourceJson(sig) {
    return resourceText(sig).then(function (text) { try { return text ? JSON.parse(text) : null; } catch (e) { return null; } });
  }
  function liveLayer(history, segments) {
    return Promise.resolve(history.sign({ explorerSegments: function () { return segments; } })).then(function (sig) {
      return history.currentLayerAt(sig);
    }).catch(function () { return null; });
  }
  function agendaLayer(history) {
    var lineage = ioc('@hypercomb.social/Lineage');
    var here = [];
    try { here = (lineage && lineage.explorerSegments && lineage.explorerSegments()) || []; } catch (e) { here = []; }
    here = here.map(function (s) { return String(s || '').trim(); }).filter(Boolean);
    var at = here.lastIndexOf('agenda');
    var tries = [];
    if (at >= 0) tries.push(here.slice(0, at + 1));
    tries.push(['agenda']);
    tries.push(here);
    tries.push([]);
    var seen = {};
    var chain = Promise.resolve(null);
    tries.forEach(function (segments) {
      var key = segments.join('/');
      if (seen[key]) return;
      seen[key] = 1;
      chain = chain.then(function (found) {
        if (found) return found;
        return liveLayer(history, segments).then(function (layer) {
          return layer && layer.name === 'agenda' ? layer : null;
        });
      });
    });
    return chain;
  }
  function doorLayer() {
    return sha256('agenda.hypercomb.com').then(function (bag) {
      var chain = Promise.resolve(null);
      bases().forEach(function (base) {
        chain = chain.then(function (found) {
          if (found) return found;
          return fetch(base + '/' + bag + '/', { cache: 'no-store' }).then(function (res) {
            if (!res.ok) return null;
            return res.text().then(function (text) {
              var names = text.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return /^\d{8}$/.test(s); });
              var last = names[names.length - 1];
              if (!last) return null;
              return jsonAt(base + '/' + bag + '/' + last).then(function (meta) {
                if (!meta || !SIG.test(String(meta.layer || ''))) return null;
                return jsonAt(base + '/' + meta.layer);
              });
            });
          }, function () { return null; });
        });
      });
      return chain;
    });
  }
  var LIST_POOL = 'agenda:list';
  function asAgenda(rec) {
    if (!rec || rec.kind !== 'agenda' || !DATE.test(String(rec.date || ''))) return null;
    rec.date = String(rec.date);
    rec.title = String(rec.title || longDate(rec.date) || rec.date);
    rec.blocks = Array.isArray(rec.blocks) ? rec.blocks : [];
    return rec;
  }
  function listedSigs(layer) {
    var decos = layer && Array.isArray(layer.decorations) ? layer.decorations : [];
    return decos.reduce(function (chain, entry) {
      var sig = String(entry || '');
      if (!SIG.test(sig)) return chain;
      return chain.then(function (found) {
        return resourceJson(sig).then(function (rec) {
          var items = rec && rec.kind === 'agenda:list' && rec.payload && rec.payload.items;
          if (!Array.isArray(items)) return found;
          items.forEach(function (item) {
            var s = String(item || '');
            if (SIG.test(s) && found.indexOf(s) < 0) found.push(s);
          });
          return found;
        });
      });
    }, Promise.resolve([]));
  }
  function sigsIn(text) {
    var rec = null;
    try { rec = text ? JSON.parse(text) : null; } catch (e) { return []; }
    if (!rec) return [];
    if (rec.kind === 'agenda' && DATE.test(String(rec.date || ''))) return ['__self__'];
    var items = rec.kind === 'agenda:list' ? (rec.items || (rec.payload && rec.payload.items)) : null;
    if (!Array.isArray(items)) return [];
    return items.map(function (item) { return String(item || ''); }).filter(function (s) { return SIG.test(s); });
  }
  function poolText(sig) {
    var store = ioc(STORE);
    if (!store || !store.openPool) return Promise.resolve('');
    return Promise.resolve(store.openPool(LIST_POOL)).then(function (dir) {
      if (!dir || !dir.getFileHandle) return '';
      return dir.getFileHandle(sig).then(function (handle) { return handle.getFile(); }).then(function (file) {
        return file.text();
      }).then(function (text) {
        return sha256(text).then(function (h) { return h === sig ? text : ''; });
      });
    }, function () { return ''; });
  }
  function poolSigs() {
    var store = ioc(STORE);
    if (!store || !store.openPool) return Promise.resolve([]);
    return Promise.resolve(store.openPool(LIST_POOL)).then(function (dir) {
      if (!dir) return [];
      var current = store.getPoolDoc
        ? Promise.resolve(store.getPoolDoc(dir)).then(function (buf) {
            if (!buf) return [];
            var text = new TextDecoder().decode(buf);
            var found = sigsIn(text);
            if (found.indexOf('__self__') < 0) return found;
            return sha256(text).then(function (sig) { return SIG.test(sig) ? [sig] : []; });
          }, function () { return []; })
        : Promise.resolve([]);
      var members = !dir.entries ? Promise.resolve([]) : (function () {
        var names = [];
        var walk = function (it) {
          return it.next().then(function (step) {
            if (step.done) return names;
            var name = String((step.value && step.value[0]) || '');
            if (SIG.test(name)) names.push(name);
            return walk(it);
          });
        };
        return walk(dir.entries()).then(function (sigs) {
          return Promise.all(sigs.map(function (sig) {
            return poolText(sig).then(function (text) {
              var found = sigsIn(text);
              if (found.indexOf('__self__') >= 0) return [sig];
              return [];
            });
          }));
        }).then(function (groups) {
          var out = [];
          groups.forEach(function (group) { group.forEach(function (sig) { if (out.indexOf(sig) < 0) out.push(sig); }); });
          return out;
        });
      })();
      return Promise.all([current, members]).then(function (both) {
        var out = [];
        both.forEach(function (list) { (list || []).forEach(function (sig) { if (out.indexOf(sig) < 0) out.push(sig); }); });
        return out;
      });
    }, function () { return []; });
  }
  function flatten(groups) {
    var out = [];
    (groups || []).forEach(function (list) { (list || []).forEach(function (row) { if (row) out.push(row); }); });
    return out;
  }
  function rowsFrom(value, depth) {
    if (value == null || depth > 6) return Promise.resolve([]);
    if (typeof value === 'string') {
      var text = value.trim();
      if (SIG.test(text)) {
        return resourceText(text).then(function (body) { return body || poolText(text); }).then(function (body) {
          var rec = null;
          try { rec = body ? JSON.parse(body) : null; } catch (e) { rec = null; }
          return rowsFrom(rec, depth + 1);
        }, function () { return []; });
      }
      try { return rowsFrom(JSON.parse(text), depth + 1); } catch (e) { return Promise.resolve([]); }
    }
    if (Array.isArray(value)) {
      return Promise.all(value.map(function (item) { return rowsFrom(item, depth + 1); })).then(flatten);
    }
    if (value.meta === 1) {
      return rowsFrom(value.data, depth + 1).then(function (rows) {
        if (rows.length) return rows;
        var hop = SIG.test(String(value.resource || '')) ? rowsFrom(String(value.resource), depth + 1) : Promise.resolve([]);
        return hop.then(function (followed) { return followed.length ? followed : (asAgenda(value) ? [asAgenda(value)] : []); });
      });
    }
    var agenda = asAgenda(value);
    if (agenda) return Promise.resolve([agenda]);
    var items = value.kind === 'agenda:list' ? (value.items || (value.payload && value.payload.items)) : null;
    if (Array.isArray(items)) return rowsFrom(items, depth + 1);
    return Promise.resolve([]);
  }
  function asLayer(value, depth) {
    if (value == null || depth > 6) return Promise.resolve(null);
    if (typeof value === 'string') {
      var text = value.trim();
      if (!SIG.test(text)) return Promise.resolve(null);
      return resourceJson(text).then(function (rec) { return asLayer(rec, depth + 1); });
    }
    if (value.meta === 1) {
      if (SIG.test(String(value.layer || ''))) return asLayer(String(value.layer), depth + 1);
      if (SIG.test(String(value.resource || ''))) return asLayer(String(value.resource), depth + 1);
      return Promise.resolve(null);
    }
    if (value.name || value.children || value.decorations || value.parameter) return Promise.resolve(value);
    return Promise.resolve(null);
  }
  function recordOf(sig) {
    return resourceJson(sig).then(function (rec) {
      if (rec && rec.meta === 1 && SIG.test(String(rec.resource || ''))) return resourceJson(String(rec.resource));
      return rec;
    });
  }
  function parameterOf(layer) {
    if (!layer) return Promise.resolve(null);
    var direct = layer.parameter != null
      ? rowsFrom(layer.parameter, 0).then(function (rows) { return rows[0] || null; })
      : Promise.resolve(null);
    return direct.then(function (found) {
      if (found) return found;
      var decos = Array.isArray(layer.decorations) ? layer.decorations : [];
      return decos.reduce(function (chain, entry) {
        return chain.then(function (hit) {
          if (hit) return hit;
          var sig = String(entry || '');
          if (!SIG.test(sig)) return null;
          return recordOf(sig).then(function (rec) {
            var payload = rec && rec.kind === 'visual:website:page' ? rec.payload : null;
            if (!payload || payload.parameter == null) return null;
            return rowsFrom(payload.parameter, 0).then(function (rows) { return rows[0] || null; });
          });
        });
      }, Promise.resolve(null));
    });
  }
  function childCards(layer) {
    var kids = layer && Array.isArray(layer.children) ? layer.children : [];
    return Promise.all(kids.map(function (kid) {
      return asLayer(kid, 0).then(function (child) {
        if (!child) return null;
        var name = String(child.name || '');
        if (!DATE.test(name)) return null;
        return parameterOf(child).then(function (agenda) {
          var row = agenda || { date: name, title: longDate(name), blocks: [] };
          row.date = name;
          row.title = String(row.title || longDate(name) || name);
          row.blocks = Array.isArray(row.blocks) ? row.blocks : [];
          return row;
        });
      });
    })).then(function (rows) { return rows.filter(Boolean); });
  }
  function itemsOf(layer) {
    return Promise.all([
      childCards(layer),
      rowsFrom(layer && layer.list, 0),
      listedSigs(layer).then(function (sigs) { return Promise.all(sigs.map(function (sig) { return rowsFrom(sig, 0); })).then(flatten); }),
      poolSigs().then(function (sigs) { return Promise.all(sigs.map(function (sig) { return rowsFrom(sig, 0); })).then(flatten); }),
    ]).then(function (groups) {
      var fill = {};
      flatten(groups.slice(1)).forEach(function (row) { if (row && row.date && !fill[row.date]) fill[row.date] = row; });
      var children = groups[0] || [];
      var base = children.length ? children : flatten(groups.slice(1));
      var seen = {};
      return base.map(function (row) {
        if (!row || seen[row.date]) return null;
        seen[row.date] = 1;
        var extra = fill[row.date];
        if (extra && !row.where && !row.time && !row.line) return extra;
        return row;
      }).filter(Boolean);
    });
  }
  function ordered(rows) {
    var t = today();
    return rows.slice().sort(function (a, b) {
      var af = a.date >= t, bf = b.date >= t;
      if (af !== bf) return af ? -1 : 1;
      if (af) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
  }
  function matches(row) {
    if (!state.q) return true;
    var blocks = (row.blocks || []).map(function (b) { return (b.title || '') + ' ' + (b.note || ''); }).join(' ');
    var hay = [row.date, row.title, row.line, row.where, row.address, longDate(row.date), blocks].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(function (w) { return !w || hay.indexOf(w) >= 0; });
  }
  function rowByDate(date) {
    for (var i = 0; i < state.rows.length; i++) if (state.rows[i].date === date) return state.rows[i];
    return null;
  }
  function chosen() {
    return rowByDate(state.selected) || ordered(state.rows)[0] || null;
  }
  function shownRows() {
    var rows = ordered(state.rows).filter(matches);
    if (state.q || !state.selected) return rows;
    var at = -1;
    for (var i = 0; i < rows.length; i++) if (rows[i].date === state.selected) { at = i; break; }
    if (at > 0) { rows = rows.slice(); rows.unshift(rows.splice(at, 1)[0]); }
    return rows;
  }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function paintStage(row) {
    var stage = $('[data-stage]');
    stage.textContent = '';
    if (!row) return;
    var lead = el('section', 'panel lead');
    lead.setAttribute('aria-label', 'The meeting');
    var head = document.createElement('header');
    head.appendChild(el('span', 'kicker', 'Meetup agenda'));
    head.appendChild(el('h1', '', row.title || 'Agenda'));
    lead.appendChild(head);
    if (row.line) lead.appendChild(el('p', 'sub', row.line));
    var facts = el('div', 'facts');
    var when = el('div');
    when.appendChild(el('div', 'mini', 'When'));
    when.appendChild(el('div', 'big', row.time && row.ends ? row.time + '–' + row.ends : (row.time || '')));
    if (row.whenNote) when.appendChild(el('div', 'sub', row.whenNote));
    else if (row.date) when.appendChild(el('div', 'sub', longDate(row.date)));
    var where = el('div');
    where.appendChild(el('div', 'mini', 'Where'));
    where.appendChild(el('div', 'big', row.where || ''));
    if (row.address) where.appendChild(el('div', 'sub', row.address));
    facts.appendChild(when);
    facts.appendChild(where);
    lead.appendChild(facts);
    if (row.bring) {
      var bring = el('p', 'bring');
      bring.appendChild(el('b', '', 'Bring'));
      bring.appendChild(document.createTextNode(' ' + row.bring));
      lead.appendChild(bring);
    }
    stage.appendChild(lead);
    var show = el('section', 'panel');
    show.appendChild(el('span', 'kicker', 'Run of show'));
    var h2 = el('h2', '', 'The morning, block by block.');
    h2.id = 'show-title';
    show.setAttribute('aria-labelledby', 'show-title');
    show.appendChild(h2);
    var ol = el('ol', 'show');
    (row.blocks || []).forEach(function (block, index, all) {
      var li = document.createElement('li');
      if (index === all.length - 1) li.className = 'end';
      li.appendChild(el('time', '', block.time || ''));
      var text = document.createElement('div');
      text.appendChild(el('b', '', block.title || ''));
      if (block.note) text.appendChild(el('span', 'note', block.note));
      li.appendChild(text);
      li.appendChild(el('span', 'min', block.min || ''));
      ol.appendChild(li);
    });
    show.appendChild(ol);
    stage.appendChild(show);
  }
  function paintList() {
    var into = $('[data-rows]');
    into.textContent = '';
    shownRows().forEach(function (row) {
      var li = document.createElement('li');
      var button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('data-date', row.date);
      if (row.date === state.selected) button.className = 'sel';
      var b = document.createElement('b');
      b.textContent = row.title || row.date;
      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = row.time && row.ends ? row.time + '–' + row.ends : (row.time || row.date.slice(5));
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = [longDate(row.date), row.where].filter(Boolean).join(' · ');
      button.appendChild(b);
      button.appendChild(when);
      button.appendChild(meta);
      li.appendChild(button);
      into.appendChild(li);
    });
  }
  function setView(next) {
    state.view = next;
    root.setAttribute('data-view', next);
    var button = $('[data-list]');
    var onList = next === 'list';
    button.setAttribute('aria-pressed', onList ? 'true' : 'false');
    button.setAttribute('aria-label', onList ? 'Show the agenda' : 'All agendas');
    $('[data-listview]').hidden = !onList;
    $('[data-stage]').hidden = onList;
  }
  function render() {
    var row = chosen();
    state.selected = row ? row.date : '';
    paintStage(row);
    paintList();
    var n = state.rows.length;
    var shown = shownRows();
    $('[data-count]').textContent = n === 1 ? '1 date' : n + ' dates';
    $('[data-empty]').hidden = n > 0;
    $('[data-nomatch]').hidden = !(n > 0 && shown.length === 0);
    if (!row) setView('list');
  }
  function atTop() {
    var page = document.scrollingElement ? document.scrollingElement.scrollTop : 0;
    var app = $('.app');
    return page < 8 && (!app || app.scrollTop < 8);
  }
  function reduced() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function expand(date) {
    state.touched = true;
    var row = rowByDate(date) || chosen();
    if (!row) { setView('list'); return; }
    state.selected = row.date;
    setView('agenda');
    paintStage(row);
    paintList();
    var page = document.scrollingElement;
    if (page) page.scrollTop = 0;
  }
  function collapse() {
    state.touched = true;
    if (state.busy) return;
    if (!chosen()) { setView('list'); render(); return; }
    if (state.view === 'list') { expand(state.selected); return; }
    var stage = $('[data-stage]');
    var finish = function () {
      state.busy = false;
      setView('list');
      paintList();
      var page = document.scrollingElement;
      if (page) page.scrollTop = 0;
    };
    if (reduced() || !stage || typeof stage.animate !== 'function') { finish(); return; }
    state.busy = true;
    var from = stage.getBoundingClientRect().height || 68;
    stage.style.overflow = 'hidden';
    var anim = stage.animate(
      [{ height: from + 'px' }, { height: '68px' }],
      { duration: 220, easing: 'cubic-bezier(.2,.7,.2,1)' }
    );
    var done = false;
    var end = function () {
      if (done) return;
      done = true;
      stage.style.overflow = '';
      stage.style.height = '';
      finish();
    };
    anim.onfinish = end;
    anim.oncancel = end;
  }
  $('[data-search]').addEventListener('input', function (e) {
    state.touched = true;
    state.q = String(e.target.value || '').trim();
    render();
  });
  $('[data-list]').addEventListener('click', function () { collapse(); });
  $('[data-rows]').addEventListener('click', function (e) {
    var button = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!button || !root.contains(button)) return;
    var date = button.getAttribute('data-date');
    if (date) expand(date);
  });
  var swipe = null;
  root.addEventListener('touchstart', function (e) {
    if (state.view !== 'agenda' || e.touches.length !== 1) { swipe = null; return; }
    swipe = { y: e.touches[0].clientY, x: e.touches[0].clientX, t: Date.now(), top: atTop() };
  }, { passive: true });
  root.addEventListener('touchend', function (e) {
    if (!swipe || !swipe.top) { swipe = null; return; }
    var t = e.changedTouches[0];
    var dy = swipe.y - t.clientY;
    var dx = Math.abs(swipe.x - t.clientX);
    var dt = Date.now() - swipe.t;
    swipe = null;
    if (dy > 48 && dx < 40 && dt < 420) collapse();
  }, { passive: true });
  root.addEventListener('touchcancel', function () { swipe = null; });
  var history = ioc(HISTORY);
  var read = history && history.sign && history.currentLayerAt
    ? agendaLayer(history).then(function (layer) { return layer || doorLayer(); })
    : doorLayer();
  read.then(function (layer) { return itemsOf(layer); }).then(function (rows) {
    state.rows = rows;
    var first = ordered(rows)[0];
    if (!state.selected) state.selected = first ? first.date : '';
    // A pull or a search before the dates arrive keeps the view they chose.
    if (!state.touched) setView(first ? 'agenda' : 'list');
    else if (!first) setView('list');
    render();
  }, function () {
    if (!state.touched) setView('list');
    render();
  });
})();
</script>
</body>
</html>
