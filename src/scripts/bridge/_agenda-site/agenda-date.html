<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Meetup agenda</title>
<meta name="description" content="One Hypercomb meetup agenda. The layout is a resource this page uses. The agenda resource is the parameter.">
</head>
<body>
<div data-root></div>
<script>
(function () {
  var roots = document.querySelectorAll('[data-root]:not([data-ready])');
  var root = roots[roots.length - 1];
  if (!root) return;
  root.setAttribute('data-ready', '');
  var SIG = /^[0-9a-f]{64}$/;
  var DATE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var HISTORY = '@diamondcoreprocessor.com/HistoryService';
  var STORE = '@hypercomb.social/Store';

  function ioc(key) {
    try { return window.ioc && window.ioc.get && window.ioc.get(key); } catch (e) { return null; }
  }
  function sha256(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function longDate(iso) {
    var m = DATE.exec(iso);
    if (!m) return '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.toLocaleDateString('en', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }
  function bases() {
    var out = [];
    if (/^https?:$/.test(location.protocol)) out.push(location.origin);
    if (location.host !== 'agenda.hypercomb.com') out.push('https://agenda.hypercomb.com');
    return out;
  }
  function textAt(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (res) { return res.ok ? res.text() : ''; }, function () { return ''; });
  }
  function resourceText(sig) {
    var net = function () {
      return bases().reduce(function (p, base) {
        return p.then(function (found) {
          if (found) return found;
          return textAt(base + '/' + sig).then(function (text) {
            if (!text) return '';
            return sha256(text).then(function (h) { return h === sig ? text : ''; });
          });
        });
      }, Promise.resolve(''));
    };
    var store = ioc(STORE);
    var local = store && store.getResourceLocal
      ? Promise.resolve(store.getResourceLocal(sig)).then(function (blob) {
          return blob && blob.text ? blob.text() : '';
        }, function () { return ''; })
      : Promise.resolve('');
    return local.then(function (text) {
      if (text) return text;
      return net().then(function (found) {
        if (found) return found;
        if (!store || !store.getResource) return '';
        return Promise.resolve(store.getResource(sig)).then(function (blob) {
          return blob && blob.text ? blob.text() : '';
        }, function () { return ''; });
      });
    });
  }
  function resourceJson(sig) {
    return resourceText(sig).then(function (text) { try { return text ? JSON.parse(text) : null; } catch (e) { return null; } });
  }
  function asAgenda(rec) {
    if (!rec || rec.kind !== 'agenda' || !DATE.test(String(rec.date || ''))) return null;
    rec.date = String(rec.date);
    rec.title = String(rec.title || longDate(rec.date) || rec.date);
    rec.blocks = Array.isArray(rec.blocks) ? rec.blocks : [];
    return rec;
  }
  function rowsFrom(value, depth) {
    if (value == null || depth > 6) return Promise.resolve([]);
    if (typeof value === 'string') {
      var text = value.trim();
      if (SIG.test(text)) {
        return resourceText(text).then(function (bodyText) {
          var rec = null;
          try { rec = bodyText ? JSON.parse(bodyText) : null; } catch (e) { rec = null; }
          return rowsFrom(rec, depth + 1);
        }, function () { return []; });
      }
      try { return rowsFrom(JSON.parse(text), depth + 1); } catch (e) { return Promise.resolve([]); }
    }
    if (Array.isArray(value)) {
      return Promise.all(value.map(function (item) { return rowsFrom(item, depth + 1); })).then(function (groups) {
        var out = [];
        groups.forEach(function (list) { (list || []).forEach(function (row) { if (row) out.push(row); }); });
        return out;
      });
    }
    if (value.meta === 1) {
      return rowsFrom(value.data, depth + 1).then(function (rows) {
        if (rows.length) return rows;
        var hop = SIG.test(String(value.resource || '')) ? rowsFrom(String(value.resource), depth + 1) : Promise.resolve([]);
        return hop.then(function (followed) { return followed.length ? followed : (asAgenda(value) ? [asAgenda(value)] : []); });
      });
    }
    var agenda = asAgenda(value);
    if (agenda) return Promise.resolve([agenda]);
    return Promise.resolve([]);
  }
  function asLayer(value, depth) {
    if (value == null || depth > 6) return Promise.resolve(null);
    if (typeof value === 'string') {
      if (!SIG.test(value.trim())) return Promise.resolve(null);
      return resourceJson(value.trim()).then(function (rec) { return asLayer(rec, depth + 1); });
    }
    if (value.meta === 1) {
      if (SIG.test(String(value.layer || ''))) return asLayer(String(value.layer), depth + 1);
      if (SIG.test(String(value.resource || ''))) return asLayer(String(value.resource), depth + 1);
      return Promise.resolve(null);
    }
    if (value.name || value.children || value.decorations || value.parameter || value.template) return Promise.resolve(value);
    return Promise.resolve(null);
  }
  function recordOf(sig) {
    return resourceJson(sig).then(function (rec) {
      if (rec && rec.meta === 1 && SIG.test(String(rec.resource || ''))) return resourceJson(String(rec.resource));
      return rec;
    });
  }
  function parameterOf(layer) {
    if (!layer) return Promise.resolve(null);
    var direct = layer.parameter != null
      ? rowsFrom(layer.parameter, 0).then(function (rows) { return rows[0] || null; })
      : Promise.resolve(null);
    return direct.then(function (found) {
      if (found) return found;
      var decos = Array.isArray(layer.decorations) ? layer.decorations : [];
      return decos.reduce(function (chain, entry) {
        return chain.then(function (hit) {
          if (hit) return hit;
          var sig = String(entry || '');
          if (!SIG.test(sig)) return null;
          return recordOf(sig).then(function (rec) {
            var payload = rec && rec.kind === 'visual:website:page' ? rec.payload : null;
            if (!payload || payload.parameter == null) return null;
            return rowsFrom(payload.parameter, 0).then(function (rows) { return rows[0] || null; });
          });
        });
      }, Promise.resolve(null));
    });
  }
  function liveLayer(segments) {
    var history = ioc(HISTORY);
    if (!history || !history.sign || !history.currentLayerAt) return Promise.resolve(null);
    return Promise.resolve(history.sign({ explorerSegments: function () { return segments; } })).then(function (sig) {
      return history.currentLayerAt(sig);
    }).catch(function () { return null; });
  }
  function dateFromHere() {
    var lineage = ioc('@hypercomb.social/Lineage');
    var segs = [];
    try { segs = (lineage && lineage.explorerSegments && lineage.explorerSegments()) || []; } catch (e) { segs = []; }
    segs = segs.map(function (s) { return String(s || '').trim(); }).filter(Boolean);
    var fromPath = location.pathname.split('/').filter(Boolean);
    var all = segs.concat(fromPath);
    for (var i = all.length - 1; i >= 0; i--) if (DATE.test(all[i])) return all[i];
    return '';
  }
  function doorRoot() {
    return sha256('agenda.hypercomb.com').then(function (bag) {
      var chain = Promise.resolve(null);
      bases().forEach(function (base) {
        chain = chain.then(function (found) {
          if (found) return found;
          return textAt(base + '/' + bag + '/').then(function (text) {
            var names = String(text || '').split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return /^\d{8}$/.test(s); });
            var last = names[names.length - 1];
            if (!last) return null;
            return textAt(base + '/' + bag + '/' + last).then(function (marker) {
              var meta = null;
              try { meta = marker ? JSON.parse(marker) : null; } catch (e) { meta = null; }
              if (!meta || !SIG.test(String(meta.layer || ''))) return null;
              return asLayer(String(meta.layer), 0);
            });
          });
        });
      });
      return chain;
    });
  }
  function childNamed(parent, date) {
    var kids = parent && Array.isArray(parent.children) ? parent.children : [];
    return kids.reduce(function (chain, kid) {
      return chain.then(function (found) {
        if (found) return found;
        return asLayer(kid, 0).then(function (child) {
          return child && String(child.name || '') === date ? child : null;
        });
      });
    }, Promise.resolve(null));
  }
  function parentLayer() {
    return liveLayer(['agenda']).then(function (layer) {
      if (layer && layer.name === 'agenda') return layer;
      return doorRoot();
    });
  }
  // The layout is a resource the parent names. Follow a meta to the bytes.
  function layoutText(parent) {
    var named = parent && parent.template != null ? parent.template : [];
    var list = Array.isArray(named) ? named : [named];
    return list.reduce(function (chain, entry) {
      return chain.then(function (found) {
        if (found) return found;
        var sig = String(entry || '');
        if (!SIG.test(sig)) return '';
        return resourceText(sig).then(function (text) {
          var rec = null;
          try { rec = text ? JSON.parse(text) : null; } catch (e) { rec = null; }
          if (rec && rec.meta === 1 && SIG.test(String(rec.resource || ''))) {
            return resourceText(String(rec.resource)).then(function (body) {
              return body && body.indexOf('data-title') >= 0 ? body : '';
            });
          }
          return text && text.indexOf('data-title') >= 0 ? text : '';
        });
      });
    }, Promise.resolve(''));
  }
  function hereLayer(parent) {
    var date = dateFromHere();
    var first = date ? liveLayer(['agenda', date]) : Promise.resolve(null);
    return first.then(function (layer) {
      if (layer && (!date || String(layer.name || '') === date)) return layer;
      return childNamed(parent, date);
    });
  }
  function fill(row) {
    var q = function (sel) { return root.querySelector(sel); };
    var title = q('[data-title]');
    if (title) title.textContent = (row && row.title) || 'Agenda';
    var line = q('[data-line]');
    if (line) {
      line.textContent = row && row.line || '';
      line.hidden = !(row && row.line);
    }
    var when = q('[data-when]');
    if (when) when.textContent = row && row.time && row.ends ? row.time + '–' + row.ends : (row && row.time) || '';
    var note = q('[data-when-note]');
    if (note) note.textContent = (row && row.whenNote) || '';
    var where = q('[data-where]');
    if (where) where.textContent = (row && row.where) || '';
    var address = q('[data-address]');
    if (address) address.textContent = (row && row.address) || '';
    var bring = q('[data-bring]');
    var bringText = q('[data-bring-text]');
    if (bringText) bringText.textContent = (row && row.bring) || '';
    if (bring) bring.hidden = !(row && row.bring);
    var show = q('[data-show]');
    if (show) {
      show.textContent = '';
      (row && row.blocks || []).forEach(function (block, index, all) {
        var li = document.createElement('li');
        if (index === all.length - 1) li.className = 'end';
        var time = document.createElement('time');
        time.textContent = block.time || '';
        var text = document.createElement('div');
        var name = document.createElement('b');
        name.textContent = block.title || '';
        text.appendChild(name);
        if (block.note) {
          var span = document.createElement('span');
          span.className = 'note';
          span.textContent = block.note;
          text.appendChild(span);
        }
        var min = document.createElement('span');
        min.className = 'min';
        min.textContent = block.min || '';
        li.appendChild(time); li.appendChild(text); li.appendChild(min);
        show.appendChild(li);
      });
    }
    if (row && row.missing) {
      if (line) { line.hidden = false; line.textContent = 'This date has no agenda yet.'; }
    }
    document.title = (row && row.title) || 'Meetup agenda';
  }
  function boot(left) {
    parentLayer().then(function (parent) {
      return Promise.all([layoutText(parent), hereLayer(parent)]).then(function (both) {
        var html = both[0];
        var layer = both[1];
        if (!html) {
          if (left > 0) { setTimeout(function () { boot(left - 1); }, 400); return; }
          root.textContent = 'This date has no layout.';
          return;
        }
        root.innerHTML = html;
        return parameterOf(layer).then(function (agenda) {
          var date = dateFromHere();
          fill(agenda || { date: date, title: longDate(date) || 'Agenda', blocks: [], missing: true });
        });
      });
    }, function () {
      if (left > 0) setTimeout(function () { boot(left - 1); }, 400);
    });
  }
  boot(8);
})();
</script>
</body>
</html>
