<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="two answers to where your work lives: behind someone else's login on their servers, or in a cell on your own device">
  <defs>
    <pattern id="wl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#a9c0d2" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="wl-gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100,0 L0,0 L0,100" fill="none" stroke="#8fabc2" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="wl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a520" stop-opacity="0.32"/><stop offset="1" stop-color="#e0a520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="400" fill="#f7f2e6"/>
  <rect width="920" height="400" fill="url(#wl-grid)"/>
  <rect width="920" height="400" fill="url(#wl-gridMajor)"/>

  <style>
    @media (prefers-reduced-motion: no-preference){
      .wl-breathe{animation:wl-pulse 4.6s ease-in-out infinite}
      @keyframes wl-pulse{0%,100%{opacity:0.6}50%{opacity:1}}
    }
  </style>

  <path d="M460,42 L460,358" stroke="#d9d4c5" stroke-width="1.3" stroke-dasharray="2 7"/>

  <!-- ══ left: for most software ═══════════════════════════════ -->
  <text x="240" y="62" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="3">MOST SOFTWARE</text>

  <!-- their servers, far away -->
  <g opacity="0.75">
    <rect x="112" y="96" width="130" height="34" rx="4" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.3"/>
    <rect x="112" y="136" width="130" height="34" rx="4" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.3"/>
    <rect x="112" y="176" width="130" height="34" rx="4" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.3"/>
    <circle cx="128" cy="113" r="3" fill="#9aa2ac"/><circle cx="128" cy="153" r="3" fill="#9aa2ac"/><circle cx="128" cy="193" r="3" fill="#9aa2ac"/>
    <path d="M156,113 L228,113 M156,153 L228,153 M156,193 L228,193" stroke="#c3c8cf" stroke-width="2"/>
  </g>
  <text x="177" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#8a9099">someone else's computer</text>

  <!-- the login between you and it -->
  <g>
    <rect x="252" y="128" width="150" height="112" rx="8" fill="#fdfcfa" stroke="#9aa2ac" stroke-width="1.4"/>
    <circle cx="327" cy="162" r="14" fill="none" stroke="#9aa2ac" stroke-width="1.6"/>
    <path d="M327,156 a6,6 0 1 1 0.01,0 M317,174 a10,7 0 0 1 20,0" fill="#c3c8cf" stroke="none"/>
    <rect x="272" y="186" width="110" height="12" rx="6" fill="#eef0f2" stroke="#c3c8cf" stroke-width="1"/>
    <rect x="272" y="204" width="110" height="12" rx="6" fill="#eef0f2" stroke="#c3c8cf" stroke-width="1"/>
    <rect x="292" y="222" width="70" height="13" rx="6.5" fill="#c3c8cf"/>
    <text x="327" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#fdfcfa" font-weight="600">LOG IN</text>
  </g>
  <text x="327" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#8a9099">someone else's login</text>

  <!-- your work, small, on the far side of both -->
  <g transform="rotate(-4 200 292)" opacity="0.8">
    <rect x="176" y="272" width="52" height="40" rx="3" fill="#ffffff" stroke="#b9bfc7" stroke-width="1.2"/>
    <path d="M184,282 L220,282 M184,291 L214,291 M184,300 L220,300" stroke="#ccd1d7" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="202" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#8a9099">your work — in someone else's format</text>

  <!-- ══ right: hypercomb ══════════════════════════════════════ -->
  <text x="690" y="62" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#9a6408" letter-spacing="3">HYPERCOMB</text>

  <!-- your device, near -->
  <rect x="548" y="96" width="284" height="188" rx="10" fill="#fdfcf8" stroke="#3a3d44" stroke-width="2"/>
  <path d="M530,286 L850,286 L864,306 Q866,310 860,310 L520,310 Q514,310 516,306 Z" fill="#ece7d8" stroke="#b9b3a4" stroke-width="1.3"/>
  <rect x="656" y="288" width="68" height="6" rx="3" fill="#d9d4c5"/>

  <!-- one cell, holding your work, lit -->
  <circle class="wl-breathe" cx="690" cy="190" r="88" fill="url(#wl-glow)"/>
  <path d="M690,132 L740,161 L740,219 L690,248 L640,219 L640,161 Z" fill="#fffdf8" stroke="#b87e10" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M690,140 L733,165 L733,215 L690,240 L647,215 L647,165 Z" fill="none" stroke="#e0a520" stroke-width="1" opacity="0.55"/>
  <g transform="rotate(-2 690 190)">
    <rect x="666" y="168" width="48" height="40" rx="3" fill="#ffffff" stroke="#d9d4c5" stroke-width="1.2"/>
    <path d="M674,178 L706,178 M674,187 L700,187 M674,196 L706,196" stroke="#c9c2af" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M674,178 L696,178" stroke="#e0a520" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- faint neighbour cells: room to grow -->
  <g fill="none" stroke="#c9b98a" stroke-width="1.1" opacity="0.5">
    <path d="M690,248 L740,277 L740,283 M640,219 L590,248 M740,161 L790,132 M640,161 L590,132"/>
  </g>

  <text x="690" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#585f68">your device · your bytes — <tspan fill="#9a6408" font-weight="600">here because you are</tspan></text>

  <text x="460" y="382" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10.5" fill="#8a9099" letter-spacing="0.8">where does your work actually live?</text>
</svg>
