<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="an ask typed at the command line passes through a door in the hive wall; the answer lands as a note pinned to a tile, in history">
  <defs>
    <pattern id="ai-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#a9c0d2" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="ai-gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100,0 L0,0 L0,100" fill="none" stroke="#8fabc2" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="ai-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a520" stop-opacity="0.5"/><stop offset="1" stop-color="#e0a520" stop-opacity="0"/>
    </radialGradient>
    <marker id="ai-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b87e10"/>
    </marker>
    <!-- flat-top hex r=40: stacks into a solid one-cell wall -->
    <path id="ai-wall" d="M40,0 L20,34.6 L-20,34.6 L-40,0 L-20,-34.6 L20,-34.6 Z"/>
  </defs>

  <rect width="920" height="430" fill="#f7f2e6"/>
  <rect width="920" height="430" fill="url(#ai-grid)"/>
  <rect width="920" height="430" fill="url(#ai-gridMajor)"/>

  <style>
    @media (prefers-reduced-motion: no-preference){
      .ai-caret{animation:ai-blink 1.15s steps(1) infinite}
      @keyframes ai-blink{50%{opacity:0}}
      .ai-flow{stroke-dasharray:7 6;animation:ai-march 1.8s linear infinite}
      @keyframes ai-march{to{stroke-dashoffset:-13}}
      .ai-doorlight{animation:ai-breathe 4.2s ease-in-out infinite}
      @keyframes ai-breathe{0%,100%{opacity:0.65}50%{opacity:1}}
    }
  </style>

  <!-- ── the cloud this does not go through ───────────────────── -->
  <g opacity="0.42">
    <path d="M120,66 a22,22 0 0 1 20,-30 a26,26 0 0 1 48,-10 a20,20 0 0 1 32,16 a16,16 0 0 1 -8,24 Z" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.2"/>
  </g>
  <path d="M108,26 L232,76" stroke="#b3423c" stroke-width="2.4" opacity="0.7" stroke-linecap="round"/>
  <text x="170" y="96" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="9.5" fill="#8a9099" letter-spacing="1">NOT THROUGH SOMEBODY'S CLOUD</text>

  <!-- ── the ask ─────────────────────────────────────────────── -->
  <rect x="60" y="168" width="330" height="48" rx="9" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1.5"/>
  <rect x="60" y="168" width="330" height="48" rx="9" fill="none" stroke="#e0a520" stroke-width="4" opacity="0.1"/>
  <text x="78" y="198" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="13.5" fill="#17191d"><tspan fill="#9a6408">&gt;</tspan> /opus what is this place?</text>
  <rect class="ai-caret" x="352" y="184" width="8" height="18" fill="#e0a520"/>
  <text x="60" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#585f68">you ask, from the command line</text>

  <!-- ── the wall, and the door you open ─────────────────────── -->
  <g fill="#f2ead2" stroke="#c9b98a" stroke-width="1.5" stroke-linejoin="round">
    <use href="#ai-wall" transform="translate(505,-7)"/>
    <use href="#ai-wall" transform="translate(505,62.3)"/>
    <use href="#ai-wall" transform="translate(505,131.6)"/>
    <use href="#ai-wall" transform="translate(505,270.2)"/>
    <use href="#ai-wall" transform="translate(505,339.5)"/>
    <use href="#ai-wall" transform="translate(505,408.8)"/>
  </g>
  <!-- the open cell -->
  <circle class="ai-doorlight" cx="505" cy="200.9" r="72" fill="url(#ai-light)"/>
  <use href="#ai-wall" transform="translate(505,200.9)" fill="#fdf6e2" stroke="#b87e10" stroke-width="2"/>
  <!-- the door leaf, swung inward -->
  <path d="M485,166.3 L497,172 L497,235 L485,235.5 Z" fill="#e0a520" fill-opacity="0.55" stroke="#7d5107" stroke-width="1.3"/>
  <circle cx="494" cy="204" r="1.8" fill="#7d5107"/>
  <!-- ── the flow: in through the door, out as a note ────────── -->
  <path class="ai-flow" d="M390,192 C428,192 448,196 470,199" fill="none" stroke="#b87e10" stroke-width="2"/>
  <path d="M540,201 C580,203 616,206 652,209" fill="none" stroke="#b87e10" stroke-width="2.2" marker-end="url(#ai-ah)"/>

  <!-- ── inside the hive: the tile, the note, the history ────── -->
  <!-- ghost comb says: this side is the hive -->
  <g fill="none" stroke="#c9b98a" stroke-width="1" opacity="0.35">
    <path d="M726,44 L760.6,64 L760.6,104 L726,124 L691.4,104 L691.4,64 Z"/>
    <path d="M830,84 L864.6,104 L864.6,144 L830,164 L795.4,144 L795.4,104 Z"/>
    <path d="M836,270 L870.6,290 L870.6,330 L836,350 L801.4,330 L801.4,290 Z"/>
  </g>

  <g>
    <path d="M726,152 L777,181.5 L777,240.5 L726,270 L675,240.5 L675,181.5 Z" fill="#fffdf8" stroke="#b87e10" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- the pinned note -->
    <g transform="rotate(-3 758 208)">
      <rect x="700" y="176" width="122" height="76" rx="3" fill="#ffffff" stroke="#d9d4c5" stroke-width="1.3"/>
      <path d="M712,196 L806,196 M712,212 L798,212 M712,228 L806,228" stroke="#c9c2af" stroke-width="2" stroke-linecap="round"/>
      <path d="M712,196 L780,196" stroke="#e0a520" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="761" cy="172" r="6" fill="#e0a520" stroke="#7d5107" stroke-width="1.4"/>
    <circle cx="759" cy="170" r="1.8" fill="#fdf6e2"/>
  </g>
  <text x="748" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#585f68">the answer — <tspan fill="#9a6408" font-weight="600">a note, on the tile</tspan></text>
  <text x="748" y="320" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099">0000 0001 0002 <tspan fill="#9a6408">0003 ●</tspan></text>
  <text x="748" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#8a9099">in history, like everything else</text>

  <text x="60" y="416" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="0.8">it walks in through a door you open — its work is content you own</text>
</svg>
