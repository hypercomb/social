<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="a laptop holding a browser holding your hive; one explicit gate lets content out to open relays; there is no server">
  <defs>
    <pattern id="pr-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#a9c0d2" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="pr-gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100,0 L0,0 L0,100" fill="none" stroke="#8fabc2" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="pr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a520" stop-opacity="0.22"/><stop offset="1" stop-color="#e0a520" stop-opacity="0"/>
    </radialGradient>
    <marker id="pr-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b87e10"/>
    </marker>
    <!-- one small cell of the hive -->
    <g id="pr-hex">
      <path d="M0,-34 L29.4,-17 L29.4,17 L0,34 L-29.4,17 L-29.4,-17 Z" fill="#fffdf8" stroke="#b87e10" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="920" height="430" fill="#f7f2e6"/>
  <rect width="920" height="430" fill="url(#pr-grid)"/>
  <rect width="920" height="430" fill="url(#pr-gridMajor)"/>

  <style>
    @media (prefers-reduced-motion: no-preference){
      .pr-flow{stroke-dasharray:7 6;animation:pr-march 1.8s linear infinite}
      @keyframes pr-march{to{stroke-dashoffset:-13}}
      .pr-relay{animation:pr-pulse 3.4s ease-in-out infinite}
      .pr-relay:nth-of-type(2){animation-delay:1.1s}
      .pr-relay:nth-of-type(3){animation-delay:2.2s}
      @keyframes pr-pulse{0%,100%{opacity:0.55}50%{opacity:1}}
    }
  </style>

  <!-- ── the device ──────────────────────────────────────────── -->
  <rect x="64" y="44" width="524" height="300" rx="12" fill="#fdfcf8" stroke="#3a3d44" stroke-width="2.2"/>
  <path d="M34,346 L618,346 L636,368 Q638,372 632,372 L20,372 Q14,372 16,368 Z" fill="#ece7d8" stroke="#b9b3a4" stroke-width="1.4"/>
  <rect x="286" y="348" width="80" height="7" rx="3.5" fill="#d9d4c5"/>
  <text x="64" y="34" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="2" >YOUR DEVICE</text>

  <!-- the browser inside it -->
  <rect x="96" y="70" width="460" height="250" rx="8" fill="#ffffff" stroke="#d9d4c5" stroke-width="1.4"/>
  <path d="M96,100 L556,100" stroke="#d9d4c5" stroke-width="1.2"/>
  <circle cx="114" cy="85" r="4" fill="#d9d4c5"/><circle cx="128" cy="85" r="4" fill="#d9d4c5"/><circle cx="142" cy="85" r="4" fill="#d9d4c5"/>
  <rect x="158" y="76" width="286" height="18" rx="9" fill="#f4f1e9"/>
  <text x="170" y="89" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10.5" fill="#6b7078">hypercomb.io — no account, no login</text>

  <!-- the hive, in the browser's private file system -->
  <circle cx="326" cy="196" r="110" fill="url(#pr-glow)"/>
  <g>
    <use href="#pr-hex" transform="translate(326,196)"/>
    <path d="M326,162 L355.4,179 L355.4,213 L326,230 L296.6,213 L296.6,179 Z" fill="#e0a520" opacity="0.28"/>
    <use href="#pr-hex" transform="translate(326,128)"/>
    <use href="#pr-hex" transform="translate(384.8,162)"/>
    <use href="#pr-hex" transform="translate(384.8,230)"/>
    <use href="#pr-hex" transform="translate(326,264)"/>
    <use href="#pr-hex" transform="translate(267.2,230)"/>
    <use href="#pr-hex" transform="translate(267.2,162)"/>
  </g>
  <g font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="9.5" fill="#9a6408" text-anchor="middle">
    <text x="326" y="200">3f2a…</text>
    <text x="384.8" y="166">c9d0…</text>
    <text x="267.2" y="234">7be1…</text>
  </g>
  <text x="326" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#585f68">your bytes — in the browser's <tspan fill="#9a6408">private file system</tspan></text>

  <!-- ── the edge of your device ─────────────────────────────── -->
  <path d="M652,34 L652,404" stroke="#6b7078" stroke-width="1.4" stroke-dasharray="6 7"/>
  <text x="652" y="22" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="2">THE EDGE OF YOUR DEVICE</text>

  <!-- the one gate through it -->
  <g>
    <rect x="630" y="176" width="44" height="44" rx="8" fill="#fffdf8" stroke="#7d5107" stroke-width="2"/>
    <path d="M652,184 L662.4,190 L662.4,202 L652,208 L641.6,202 L641.6,190 Z" fill="#e0a520" stroke="#7d5107" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="652" cy="213" r="1.8" fill="#7d5107"/>
  </g>
  <text x="652" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#9a6408" font-weight="600">publish</text>
  <text x="652" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#585f68">optional · explicit</text>

  <!-- nothing moves until the gate: dashed to it, solid after -->
  <path class="pr-flow" d="M394,196 C480,196 560,197 624,198" fill="none" stroke="#b87e10" stroke-width="1.9"/>
  <path d="M676,198 C706,198 724,186 744,172" fill="none" stroke="#b87e10" stroke-width="2.2" marker-end="url(#pr-ah)"/>
  <path d="M676,200 C710,204 730,216 752,232" fill="none" stroke="#b87e10" stroke-width="2.2" marker-end="url(#pr-ah)"/>

  <!-- ── open relays, peer to peer ───────────────────────────── -->
  <g stroke="#4a7396" stroke-width="1.8" fill="#ffffff">
    <circle class="pr-relay" cx="782" cy="152" r="15"/>
    <circle class="pr-relay" cx="822" cy="242" r="15"/>
    <circle class="pr-relay" cx="768" cy="318" r="15"/>
  </g>
  <g fill="#4a7396">
    <circle cx="782" cy="152" r="3.4"/><circle cx="822" cy="242" r="3.4"/><circle cx="768" cy="318" r="3.4"/>
  </g>
  <g stroke="#4a7396" stroke-width="1" opacity="0.4">
    <path d="M793,163 L812,230"/><path d="M812,252 L779,308"/>
  </g>
  <text x="795" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#3d6280">open relays — peer to peer</text>

  <!-- ── the thing that isn't there ──────────────────────────── -->
  <g opacity="0.4">
    <rect x="748" y="40" width="120" height="22" rx="3" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.2"/>
    <rect x="748" y="66" width="120" height="22" rx="3" fill="#e7e9ec" stroke="#9aa2ac" stroke-width="1.2"/>
    <circle cx="762" cy="51" r="2.5" fill="#9aa2ac"/><circle cx="762" cy="77" r="2.5" fill="#9aa2ac"/>
    <path d="M846,44 L858,51 M846,70 L858,77" stroke="#9aa2ac" stroke-width="1.4"/>
  </g>
  <path d="M740,32 L876,96" stroke="#b3423c" stroke-width="2.6" opacity="0.7" stroke-linecap="round"/>
  <text x="808" y="114" text-anchor="middle" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="1">NO SERVER · NO ACCOUNT</text>

  <text x="64" y="416" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="10" fill="#8a9099" letter-spacing="0.8">nothing leaves until you say so — presence is permission</text>
</svg>
