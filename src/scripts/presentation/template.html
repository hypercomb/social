<meta charset="utf-8">
<title>Hypercomb — The Hive Is Yours</title>
<style>
  :root{
    --bg:#0a0e15; --bg2:#0d131d; --panel:#101724; --line:#1f2a3a;
    --ink:#e9e4d4; --dim:#939dad; --faint:#5b6675;
    --honey:#f2b632; --honey-deep:#b98413; --honey-glow:rgba(242,182,50,.14);
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;height:100%}
  *{box-sizing:border-box}

  /* ---------- ambient honeycomb ---------- */
  #comb{position:fixed;inset:0;opacity:.5;pointer-events:none}
  @media (prefers-reduced-motion: no-preference){
    #comb{animation:drift 90s linear infinite alternate}
    @keyframes drift{from{transform:translate3d(0,0,0) scale(1.02)}to{transform:translate3d(-40px,-24px,0) scale(1.06)}}
  }

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2vh;padding:4vh 6vw 25vh;opacity:0;visibility:hidden;transition:opacity .9s ease;text-align:center}
  .scene.on{opacity:1;visibility:visible}
  .eyebrow{font-family:var(--mono);font-size:clamp(10px,1.2vw,13px);letter-spacing:.42em;text-transform:uppercase;color:var(--honey);opacity:.9}
  .scene h1{font-weight:200;font-size:clamp(34px,6.2vw,88px);line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance}
  .scene h1 b{font-weight:600;color:var(--honey)}
  .scene .sub{color:var(--dim);font-weight:300;font-size:clamp(15px,1.7vw,22px);max-width:62ch;margin:0;text-wrap:balance}
  .sig{font-family:var(--mono);color:var(--faint);font-size:clamp(9px,1vw,12px);letter-spacing:.06em;word-break:break-all;max-width:70ch}
  .sig em{color:var(--honey);font-style:normal}

  .filmwrap{width:min(1100px,88vw);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 30px 80px -30px rgba(0,0,0,.9),0 0 120px -40px var(--honey-glow);position:relative}
  .filmwrap video{display:block;width:100%;height:auto}
  .filmtag{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink);background:rgba(10,14,21,.72);border:1px solid var(--line);
    padding:5px 10px;border-radius:4px}
  .filmtag::before{content:"●";color:#e5484d;margin-right:8px;animation:blink 1.6s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* hex badge rows (DNA, reasons) */
  .hexrow{display:flex;gap:clamp(10px,2vw,26px);flex-wrap:wrap;justify-content:center}
  .hexb{width:clamp(96px,12vw,150px);aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%);
    background:linear-gradient(160deg,var(--panel),#0b1119);border:1px solid var(--line);position:relative}
  .hexb::after{content:"";position:absolute;inset:1px;clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%);
    border:1px solid rgba(242,182,50,.25);pointer-events:none}
  .hexb .g{font-size:clamp(20px,2.6vw,34px);color:var(--honey)}
  .hexb .t{font-family:var(--mono);font-size:clamp(9px,1vw,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);max-width:74%;text-align:center;line-height:1.35;word-break:break-word}

  /* layer stack diagram */
  .stack{display:flex;flex-direction:column-reverse;gap:8px;align-items:center}
  .lay{width:min(520px,70vw);border:1px solid var(--line);background:linear-gradient(90deg,var(--panel),#0b1119);
    border-radius:6px;padding:10px 18px;font-family:var(--mono);font-size:clamp(10px,1.2vw,13px);color:var(--dim);
    display:flex;justify-content:space-between;letter-spacing:.08em}
  .lay.head{border-color:var(--honey-deep);color:var(--ink);box-shadow:0 0 40px -12px var(--honey-glow)}
  .lay.head .m{color:var(--honey)}

  /* roadmap */
  .road{display:flex;flex-direction:column;gap:14px;width:min(760px,86vw);text-align:left}
  .mile{display:grid;grid-template-columns:14px 1fr;gap:16px;align-items:start}
  .mile .dot{width:10px;height:10px;margin-top:7px;background:var(--honey);clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)}
  .mile.dim .dot{background:var(--faint)}
  .mile .mt{font-weight:600;font-size:clamp(15px,1.8vw,21px)}
  .mile .md{color:var(--dim);font-weight:300;font-size:clamp(13px,1.5vw,17px)}

  /* ---------- chrome ---------- */
  #caption{position:fixed;left:50%;bottom:6.5vh;transform:translateX(-50%);width:min(940px,88vw);text-align:center;
    color:var(--ink);font-weight:300;font-size:clamp(13px,1.55vw,18px);line-height:1.55;
    background:rgba(9,12,18,.78);border:1px solid var(--line);border-radius:10px;padding:14px 22px;
    backdrop-filter:blur(6px);opacity:0;transition:opacity .6s;z-index:40}
  #caption.on{opacity:1}
  #caption .q{color:var(--honey)}

  #bar{position:fixed;left:0;right:0;bottom:0;height:8vh;min-height:52px;display:flex;align-items:center;gap:14px;
    padding:0 20px;background:linear-gradient(180deg,transparent,rgba(6,9,14,.92) 35%);z-index:50}
  #ticks{flex:1;display:flex;gap:4px;height:22px;align-items:center}
  .tick{flex:1;height:3px;background:var(--line);border-radius:2px;cursor:pointer;transition:background .3s,height .15s;position:relative}
  .tick:hover{height:6px}
  .tick.done{background:var(--honey-deep)}
  .tick.now{background:var(--honey);box-shadow:0 0 10px var(--honey-glow)}
  .btn{background:none;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;border-radius:6px;padding:8px 13px;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
  .btn:hover{border-color:var(--honey);color:var(--honey)}
  .btn:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
  #actlbl{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  #actlbl em{color:var(--honey);font-style:normal}

  /* splash */
  #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3.4vh;background:radial-gradient(120vw 90vh at 50% 42%,#0e1626 0%,var(--bg) 62%);transition:opacity 1s;text-align:center;padding:0 6vw}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .word{font-family:var(--mono);font-weight:600;font-size:clamp(26px,4.6vw,58px);letter-spacing:.58em;margin-left:.58em}
  #splash .tag{color:var(--dim);font-weight:300;font-size:clamp(14px,1.8vw,21px);max-width:52ch;text-wrap:balance}
  #enter{background:none;border:1px solid var(--honey-deep);color:var(--honey);font-family:var(--mono);
    font-size:clamp(12px,1.4vw,15px);letter-spacing:.34em;text-transform:uppercase;padding:16px 34px 16px 40px;border-radius:8px;cursor:pointer;
    transition:background .3s,box-shadow .3s}
  #enter:hover{background:var(--honey-glow);box-shadow:0 0 60px -10px var(--honey-glow)}
  #splash .meta{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
  #hexmark{width:clamp(64px,8vw,104px);filter:drop-shadow(0 0 30px var(--honey-glow))}

  .golink{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:clamp(11px,1.3vw,14px);
    letter-spacing:.22em;text-transform:uppercase;color:var(--honey);text-decoration:none;
    border:1px solid var(--honey-deep);border-radius:8px;padding:13px 24px;transition:background .3s,box-shadow .3s}
  .golink:hover{background:var(--honey-glow);box-shadow:0 0 50px -12px var(--honey-glow)}
  .golink:focus-visible{outline:2px solid var(--honey);outline-offset:3px}
  #splash .golink{font-size:clamp(10px,1.1vw,12px);padding:9px 18px;border-color:var(--line);color:var(--dim)}
  #splash .golink:hover{border-color:var(--honey-deep);color:var(--honey)}
  #endcard{display:none}
  @media (max-width:700px){
    #caption{bottom:9vh;font-size:13px}
    .scene{padding-bottom:30vh}
  }
</style>

<svg id="comb" aria-hidden="true"><defs>
  <pattern id="hexp" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(1.6)">
    <polygon points="28,0 56,16.2 56,48.5 28,64.7 0,48.5 0,16.2" fill="none" stroke="#141d2b" stroke-width="1" transform="translate(0,0)"/>
    <polygon points="28,0 56,16.2 56,48.5 28,64.7 0,48.5 0,16.2" fill="none" stroke="#141d2b" stroke-width="1" transform="translate(28,48.5)"/>
    <polygon points="28,0 56,16.2 56,48.5 28,64.7 0,48.5 0,16.2" fill="none" stroke="#141d2b" stroke-width="1" transform="translate(-28,48.5)"/>
  </pattern></defs>
  <rect width="120%" height="120%" fill="url(#hexp)"/>
</svg>

<div id="stage" aria-live="polite"></div>

<div id="caption"></div>

<div id="bar" hidden>
  <button class="btn" id="pp" title="play / pause (space)">pause</button>
  <button class="btn" id="prev" title="previous scene (←)">‹</button>
  <button class="btn" id="next" title="next scene (→)">›</button>
  <div id="ticks"></div>
  <span id="actlbl"></span>
  <button class="btn" id="voice" title="toggle narration voice">voice on</button>
</div>

<div id="splash">
  <svg id="hexmark" viewBox="-52 -52 104 104"><polygon points="50,0 25,43.3 -25,43.3 -50,0 -25,-43.3 25,-43.3" fill="none" stroke="#f2b632" stroke-width="2.5"/><polygon points="30,0 15,26 -15,26 -30,0 -15,-26 15,-26" fill="none" stroke="#f2b632" stroke-width="1.2" opacity=".5"/><circle r="4" fill="#f2b632"/></svg>
  <div class="word">hypercomb</div>
  <div class="tag">An open software platform. What it is, why you want it, and the road ahead — with live footage from a real hive.</div>
  <button id="enter">▸ &nbsp;press play</button>
  <div class="meta">≈ 18 minutes · 23 scenes · narrated, with captions · space = pause · ← → = skip</div>
  <a class="golink" href="https://hypercomb.io" target="_blank" rel="noopener">skip the tour · open hypercomb.io ↗</a>
</div>

<script>
/* ============================ scenes ============================ */
const V = {
  navigate: "{{VID_NAVIGATE}}",
  zoom:     "{{VID_ZOOM}}",
  create:   "{{VID_CREATE}}",
  children: "{{VID_CHILDREN}}",
};

const SCENES = [
/* ------------------------------- ACT I : WHAT ------------------------------- */
{ act:"what", name:"a question first", eyebrow:"a question first", html:`
  <h1>Where does your <b>work</b> actually live?</h1>
  <p class="sub">For most software the honest answer is: on someone else's computer, behind someone else's login, in someone else's format.</p>`,
  say:`This is Hypercomb. Before we explain anything, one question. Where does your work actually live? For most software, the honest answer is: on someone else's computer, behind someone else's login, in someone else's format. Hypercomb starts from a different premise — your work lives with you. Everything you're about to see is a real, working application: every piece of footage in this presentation was recorded live from a real hive. By the end, you'll know what Hypercomb is, why it exists, and where it's going.`},

{ act:"what", name:"welcome", eyebrow:"welcome", html:`
  <h1>Welcome to <b>Hypercomb</b></h1>
  <p class="sub">An open software platform — open in every sense that matters.</p>
  <div class="hexrow">
    <div class="hexb"><span class="g">⌘</span><span class="t">open source</span></div>
    <div class="hexb"><span class="g">⬡</span><span class="t">open format</span></div>
    <div class="hexb"><span class="g">⚙</span><span class="t">open platform</span></div>
    <div class="hexb"><span class="g">◈</span><span class="t">open network</span></div>
  </div>`,
  say:`Welcome to Hypercomb. Hypercomb is an open software platform — and open in every sense that matters. The source is open: it's free software, and the documentation is Creative Commons. The format is open: your content is plain, content-addressed bytes, not a proprietary database anyone else controls. The platform is open: every feature is a module you can write, fork, and share. And the network is open: participants exchange work directly over public relays, with no gatekeeper in the middle. It's built in the open, by a community, for people who want their tools to belong to them.`},

{ act:"what", name:"the hive", eyebrow:"what it is", html:`
  <h1>The <b>hive</b>: a workspace made of cells</h1>
  <div class="filmwrap"><span class="filmtag">live capture · localhost hive</span><video muted playsinline loop src="{{navigate}}"></video></div>`,
  media:"navigate",
  say:`Hypercomb is a live, presence-based workspace. Your content lives on a hexagonal grid of cells — tiles. A tile can hold anything: a picture, a note, a document, a game, a whole website. Click a tile and you travel into it — every tile can open into another full honeycomb of its own. That is the whole navigation model: the hive is a tree of honeycombs, and you fly through it. What you're watching is a real hive — a family archive, a cigar lounge, an A.I. research collection, a behaviors library — all tiles, all the way down.`},

{ act:"what", name:"presence is permission", eyebrow:"no server, no account", html:`
  <h1><b>Presence</b> is permission</h1>
  <p class="sub">The application runs entirely in your browser. Content is stored on your device, in the browser's private file system. Publishing is optional — and explicit.</p>
  <div class="sig">your device &nbsp;⬡&nbsp; your browser &nbsp;⬡&nbsp; your bytes — <em>nothing leaves until you say so</em></div>`,
  say:`Here's the part that sounds impossible: there is no server. No account. No sign-up. Hypercomb runs entirely in your browser, and your content is stored on your own device, in the browser's private file system. Presence is permission — the data exists where you are. Publishing is optional and explicit: nothing leaves your machine until you decide to share it. And when you do share, it travels peer to peer over open relays — not into a company's database.`},

{ act:"what", name:"signatures", eyebrow:"the identity primitive", html:`
  <h1>One kind of name: the <b>signature</b></h1>
  <div class="sig">sign(content) → <em>e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</em></div>
  <p class="sub">Sixty-four characters, computed from the bytes themselves. Same content → same name, on every machine, forever.</p>`,
  say:`Everything in Hypercomb has one kind of name: a signature — the SHA-256 hash of its content. Sixty-four characters that are the same on every machine, in every country, forever. Same content, same signature; change one byte and it's a different thing with a different name. This single idea does enormous work. Content can be verified — the name proves the bytes. It deduplicates itself — the same picture stored twice is stored once. It can be cached forever — a signature never goes stale. And it can be shared as a tiny string that any participant can resolve. Signatures aren't an implementation detail. They are the identity system, the reference system, and the trust system — all at once.`},

{ act:"what", name:"dna", eyebrow:"the substrate", html:`
  <h1>The <b>DNA</b> of a hive</h1>
  <div class="hexrow">
    <div class="hexb"><span class="g">⬡</span><span class="t">layers</span></div>
    <div class="hexb"><span class="g">🖼</span><span class="t">resources</span></div>
    <div class="hexb"><span class="g">🐝</span><span class="t">beehaviors</span></div>
    <div class="hexb"><span class="g">⛓</span><span class="t">dependencies</span></div>
    <div class="hexb"><span class="g">✎</span><span class="t">content</span></div>
  </div>
  <p class="sub">Distributed Network Artifacts — content-addressed, immutable, merkle-versioned, shareable.</p>`,
  say:`Five kinds of artifact compose everything. Hypercomb calls them its D N A — Distributed Network Artifacts. Layers: the structure — each one an immutable snapshot linking to its children by signature. Resources: the content bytes — images, text, files. Bees — short for beehaviors — small modules of code that give the hive life. Dependencies: the libraries those bees rely on. And content: everything a tile carries. All five are content-addressed, immutable, merkle-versioned, and shareable across the network. Your entire hive is just these five kinds, combined.`},

{ act:"what", name:"history is the data", eyebrow:"nothing is overwritten", html:`
  <h1>History <b>is</b> the data structure</h1>
  <div class="stack">
    <div class="lay"><span>0000</span><span>first layer</span></div>
    <div class="lay"><span>0001</span><span>added a tile</span></div>
    <div class="lay"><span>0002</span><span>changed a picture</span></div>
    <div class="lay head"><span class="m">0003</span><span class="m">← the newest marker IS the current state</span></div>
  </div>`,
  say:`Every change you make becomes a new layer — nothing is ever overwritten. The history of a place is a bag of numbered markers, and the newest marker is the current state. That has a beautiful consequence: undo isn't a trick — it's just reading an older layer. You can rewind any page, restore any moment, name a revision, or snapshot the whole hive before an experiment. Your history is not a log about the data; it is the data. Deploying, backing up, and remembering become the same operation.`},

{ act:"what", name:"the language", eyebrow:"the vocabulary", html:`
  <h1>The <b>language</b> of Hypercomb</h1>
  <div class="hexrow">
    <div class="hexb"><span class="g">⬡</span><span class="t">hive</span></div>
    <div class="hexb"><span class="g">⬢</span><span class="t">tile</span></div>
    <div class="hexb"><span class="g">▤</span><span class="t">layer</span></div>
    <div class="hexb"><span class="g">#</span><span class="t">signature</span></div>
    <div class="hexb"><span class="g">🐝</span><span class="t">bee</span></div>
    <div class="hexb"><span class="g">✽</span><span class="t">pheromone</span></div>
  </div>
  <p class="sub">The colony is an accurate model for a system with no central authority.</p>`,
  say:`Hypercomb has its own language, and it's worth learning, because the words are precise. A hive is one participant's whole tree. A tile is one hexagon of content. A layer is one immutable version of a place. A signature is the name computed from the content itself. A bee is a beehavior — a module that senses and acts. A pheromone is a mark you put on a tile saying what it is, so the software can behave accordingly without anyone hardcoding rules for it. Pollination is how work crosses between hives. Brooding and eclosion are how tiles are prepared, and then hatch onto your screen. The colony metaphor isn't decoration — it's a genuinely accurate model for a system that has no central authority.`},

{ act:"what", name:"beehaviors", eyebrow:"features are modules", html:`
  <h1>Everything alive is a <b>bee</b></h1>
  <p class="sub">Bee, short for <b style="color:var(--honey)">beehavior</b> — navigation, editing, games, the command line itself: each one a small signed module that senses when it's relevant and acts. The shell is just a loader.</p>
  <div class="sig">sense(grammar) → heartbeat(grammar) → <em>emit effects</em> — bees never call each other</div>`,
  say:`Features aren't welded into the app. Every behavior — navigation, editing, games, the command line itself — is a bee — short for beehavior: a small self-contained module that senses when it's relevant and acts. Bees are signed like everything else, so they can be shared, forked, improved, and adopted from the community with cryptographic integrity. The shell is just a loader. If you want Hypercomb to do something new, you don't wait for a vendor — you add a bee.`},

{ act:"what", name:"type a name press enter", eyebrow:"creation, live", html:`
  <h1>Type a name. <b>Press Enter.</b></h1>
  <div class="filmwrap"><span class="filmtag">live capture · creating structure</span><video muted playsinline loop src="{{children}}"></video></div>`,
  media:"children",
  say:`Creating is one gesture: type a name, press Enter — that's a tile. Type three more names — that's a structure. This is how everything gets built, including how Hypercomb documents itself: every feature gets a mirror in the hive — tiles for its parts, notes explaining them, pheromone marks classifying them. The hive isn't documentation about the system; the hive is the living specification of the system. In fact, the presentation tile you just watched being created is this very presentation, mirrored into the hive, with its three chapters as children.`},

{ act:"what", name:"scriptable building blocks", eyebrow:"composable by design", html:`
  <h1>Scriptable <b>building blocks</b></h1>
  <div class="stack">
    <div class="lay"><span>type a name</span><span>a tile exists</span></div>
    <div class="lay"><span>/present</span><span>the tile becomes a slideshow</span></div>
    <div class="lay"><span>/website</span><span>the tile becomes a site</span></div>
    <div class="lay head"><span class="m">write a bee, sign it, share it</span><span class="m">→ a new verb for everyone</span></div>
  </div>`,
  say:`Everything is a scriptable building block. The command line is the primary interface: type a name to create, type a path to travel, and use slash commands as verbs — rewind a page, publish a website, open a game, ask an A.I. Behaviors attach to any tile, so the same tile becomes a slideshow, a website, a study deck, or a tree view depending on what you mark it with. And because behaviors are modules, the vocabulary itself is extensible: write a bee, sign it, share it — and it becomes a verb anyone can use. You're not filling in someone else's forms. You're composing your own blocks.`},

/* ------------------------------- ACT II : WHY ------------------------------- */
{ act:"why", name:"ownership", eyebrow:"reason one", html:`
  <h1><b>Ownership</b> that isn't a metaphor</h1>
  <p class="sub">Your hive is files on your device. It works on a plane. It works if the company disappears — because there is no company in the loop.</p>`,
  say:`So why would you want this? Reason one: ownership that isn't a metaphor. Your hive is files on your device. It works on a plane. It works if the company disappears — because there is no company in the loop. Export it, inspect it, move it: nothing is held hostage. Software you depend on should have an exit. Hypercomb's exit is built into its physics.`},

{ act:"why", name:"verifiable integrity", eyebrow:"reason two", html:`
  <h1>Integrity you can <b>verify</b></h1>
  <p class="sub">Share a branch, and the receiver's machine proves every byte. Identical content collapses to one copy across the whole network.</p>
  <div class="sig">receive(sig) → hash(bytes) ≟ sig → <em>proof, not trust</em></div>`,
  say:`Reason two: integrity you can verify instead of trust. When someone shares a branch of their hive, you receive signatures, and your machine verifies that every byte matches. Identical content collapses into one copy no matter how many people reference it, and the network becomes a global cache — if anyone near you already holds a resource, the signature finds it. Sharing a hash is sharing a proof.`},

{ act:"why", name:"time is a feature", eyebrow:"reason three", html:`
  <h1><b>Time</b> is a feature</h1>
  <p class="sub">Full undo across sessions · a visual rewind window · named revisions on adopt and upgrade · checkpoint snapshots before experiments.</p>`,
  say:`Reason three: you get time as a feature. Full undo across sessions. A rewind window that visually scrubs through what a page used to look like. Named revisions when you adopt or upgrade someone's work. Checkpoint snapshots before risky experiments. Because every state is an immutable layer, the past is always one signature away — and it never rots.`},

{ act:"why", name:"open source", eyebrow:"reason four", html:`
  <h1><b>Open source</b>, as a promise</h1>
  <div class="hexrow">
    <div class="hexb"><span class="g">⌘</span><span class="t">AGPL-3.0</span></div>
    <div class="hexb"><span class="g">✎</span><span class="t">CC BY-SA</span></div>
    <div class="hexb"><span class="g">⑂</span><span class="t">fork it</span></div>
  </div>
  <p class="sub">Code under AGPL, documentation under Creative Commons. Every module is signed — so a fork is verifiable.</p>`,
  say:`Reason four: it's open source — and here that's a promise, not a marketing line. The code is A G P L: free to use, free to study, free to change, and any hosted version has to stay free too. The documentation is Creative Commons. Every module carries a signature, so a fork is verifiable — you can prove exactly what you're running, byte for byte. And if Hypercomb ever goes in a direction you don't like, you can take it in yours, and your hive still opens. That's what open actually has to mean.`},

{ act:"why", name:"community platform", eyebrow:"reason five", html:`
  <h1>A platform shaped like a <b>community</b></h1>
  <div class="filmwrap"><span class="filmtag">live capture · one hive, many worlds</span><video muted playsinline loop src="{{zoom}}"></video></div>`,
  media:"zoom",
  say:`Reason five: it's a platform shaped like a community. Domains are modules: a cigar journal with a flavor wheel and a full 3D lounge. Arcade games. Tutorial courses. Embedded websites, published straight from tiles. All of them are bees and layers — which means all of them are forkable, shareable, and yours to remix. The distance between a user and a developer collapses to a signature.`},

{ act:"why", name:"sharing without a middleman", eyebrow:"reason six", html:`
  <h1>Sharing without a <b>middleman</b></h1>
  <p class="sub">Publishing a branch is one command. Visitors adopt your work as a named revision line — and can still rewind to exactly what you shipped.</p>
  <div class="sig">your hive → <em>signed layers</em> → their hive — no account in between</div>`,
  say:`Reason six: sharing without a middleman. Publishing a branch is one command. Content travels over open relays and lands in the visitor's own hive as a named revision line — they can adopt your work, carry it forward, and still rewind to exactly what you shipped. Collaboration becomes two hives exchanging signed layers. No accounts to reconcile, no permissions matrix. Cryptography instead of bureaucracy.`},

{ act:"why", name:"ai on your terms", eyebrow:"reason seven", html:`
  <h1><b>AI</b>, on your terms</h1>
  <p class="sub">Ask from the command line; an AI session answers as a note pinned to your tile. It builds structures, study decks, websites — inside your hive, with history.</p>
  <div class="sig">/opus what is this place? → <em>answer lands as a note, on the tile, in history</em></div>`,
  say:`And reason seven: A.I. is a first-class citizen — on your terms. The bridge lets A.I. sessions work inside the hive. You ask a question from the command line, and an A.I. answers as a note pinned to the tile you asked about. It can build structures, generate study decks from your notes, assemble websites from your tiles, run feedback loops. The A.I. doesn't scrape your life through somebody's cloud — it walks into your hive through a door you open, and its work lands as content you own, with history.`},

/* ============================ engine ============================ */
const stage=document.getElementById('stage'), cap=document.getElementById('caption'),
      bar=document.getElementById('bar'), ticks=document.getElementById('ticks'),
      actlbl=document.getElementById('actlbl'), ppBtn=document.getElementById('pp'),
      voiceBtn=document.getElementById('voice');
const ACT={what:'I · what it is',why:'II · why you want it',roadmap:'III · the road ahead'};
let idx=-1, playing=false, voiceOn=true, token=0, timer=null, chosenVoice=null;

SCENES.forEach((s,i)=>{
  const d=document.createElement('div');d.className='scene';
  d.innerHTML=`<div class="eyebrow">${s.eyebrow}</div>${s.html.replaceAll('{{navigate}}',V.navigate).replaceAll('{{zoom}}',V.zoom).replaceAll('{{create}}',V.create).replaceAll('{{children}}',V.children)}`;
  stage.appendChild(d); s.el=d;
  const t=document.createElement('div');t.className='tick';t.title=`scene ${i+1}`;
  t.addEventListener('click',()=>goto(i,true)); ticks.appendChild(t); s.tick=t;
});

const AUDIO = {{AUDIO_JSON}};
let voiceTrack = null; /* one Audio per scene — handlers can never cross scenes */

function fallbackSecs(text){ return Math.max(8, text.split(/\s+/).length/2.4); }

function narrate(s,myToken){
  clearTimeout(timer);
  if(voiceTrack){ voiceTrack.onended=null; voiceTrack.onerror=null; voiceTrack.pause(); }
  if(voiceOn && AUDIO[idx]){
    const a=new Audio(AUDIO[idx]); voiceTrack=a;
    a.onended=()=>{ if(myToken===token&&playing&&voiceTrack===a) timer=setTimeout(()=>advance(myToken),800); };
    a.onerror=()=>{ if(myToken===token&&playing&&voiceTrack===a) timer=setTimeout(()=>advance(myToken),fallbackSecs(s.say)*1000); };
    a.play().catch(()=>{ if(myToken===token&&playing&&voiceTrack===a) timer=setTimeout(()=>advance(myToken),fallbackSecs(s.say)*1000); });
  } else {
    timer=setTimeout(()=>advance(myToken),fallbackSecs(s.say)*1000);
  }
}
function advance(myToken){ if(myToken!==token)return; if(idx<SCENES.length-1)goto(idx+1,false); else finish(); }

function goto(i,manual){
  token++; const myToken=token; clearTimeout(timer);
  if(voiceTrack)voiceTrack.pause();
  if(idx>=0){SCENES[idx].el.classList.remove('on');SCENES[idx].tick.classList.remove('now');}
  idx=i; const s=SCENES[i];
  s.el.classList.add('on');
  SCENES.forEach((x,k)=>{x.tick.classList.toggle('done',k<i);x.tick.classList.remove('now');});
  s.tick.classList.add('now');
  actlbl.innerHTML=`act <em>${ACT[s.act]}</em> · ${i+1}/${SCENES.length}`;
  cap.classList.add('on'); cap.textContent=s.say;
  s.el.querySelectorAll('video').forEach(v=>{try{v.currentTime=0;v.play().catch(()=>{});}catch(e){}});
  setTimeout(()=>{ if(myToken===token) s.el.querySelectorAll('video').forEach(v=>{ if(v.paused) v.play().catch(()=>{}); }); },500);
  if(manual&&!playing){/* stay paused, just show */}
  if(playing)narrate(s,myToken);
}

function setPlaying(p){
  playing=p; ppBtn.textContent=p?'pause':'play';
  if(!p){ clearTimeout(timer); if(voiceTrack)voiceTrack.pause(); }
  else if(idx>=0){
    /* resume mid-scene if the narration was paused partway, else restart the scene */
    if(voiceOn && voiceTrack && voiceTrack.currentTime>0 && !voiceTrack.ended){ voiceTrack.play().catch(()=>goto(idx,false)); }
    else goto(idx,false);
  }
}
function finish(){ setPlayingSilent(false); if(voiceTrack)voiceTrack.pause(); cap.textContent='∎ — replay any scene from the bar below, or press play to run it again from the top.'; }
function setPlayingSilent(p){ playing=p; ppBtn.textContent=p?'pause':'play'; }

ppBtn.onclick=()=>{ if(!playing&&idx===SCENES.length-1&&(!voiceTrack||voiceTrack.ended||voiceTrack.paused)){ setPlayingSilent(true); goto(0,false);} else setPlaying(!playing); };
let lastNav=0; const throttled=fn=>()=>{const now=Date.now(); if(now-lastNav<250)return; lastNav=now; fn();};
document.getElementById('prev').onclick=throttled(()=>goto(Math.max(0,idx-1),!playing));
document.getElementById('next').onclick=throttled(()=>{ if(idx<SCENES.length-1)goto(idx+1,!playing); else finish(); });
voiceBtn.onclick=()=>{ voiceOn=!voiceOn; voiceBtn.textContent=voiceOn?'voice on':'voice off';
  if(voiceTrack)voiceTrack.pause(); if(playing&&idx>=0)goto(idx,false); };
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();ppBtn.click();}
  if(e.key==='ArrowRight')document.getElementById('next').click();
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
});
document.getElementById('enter').onclick=()=>{
  document.getElementById('splash').classList.add('gone'); bar.hidden=false;
  setPlayingSilent(true); goto(0,false); /* click is the user gesture that unlocks audio */
};
addEventListener('visibilitychange',()=>{ if(document.hidden&&playing)setPlaying(false); });
</script>
